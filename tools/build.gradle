plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets.main {
    java.srcDirs = ['src/']
}

import arc.files.Fi
import arc.func.Func2
import arc.struct.IntMap
import arc.struct.ObjectMap
import arc.struct.OrderedMap
import arc.struct.Seq
import arc.util.io.PropertiesUtils
import groovy.json.JsonOutput
import javax.lang.model.SourceVersion

dependencies {
    implementation project(':main')
    compileOnly project(':annotations')
    annotationProcessor project(':annotations')
    implementation "com.github.Anuken.Arc:arc-core:$arcVersion"
    implementation "com.github.Anuken.Mindustry:core:$mindustryVersion"
}

tasks.register('generateSounds') {
    // The install task also cleans :main, which owns this generated file.
    mustRunAfter ':main:clean'
    def soundsDir = new File(assetsDir, 'sounds')
    def soundFiles = fileTree(soundsDir) { include '**/*.ogg', '**/*.mp3' }
    def output = project(':main').layout.buildDirectory.file(
        'generated/sources/soundKeys/java/main/aquarion/content/AquaSounds.java'
    )
    inputs.files(soundFiles).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(output)

    doLast {
        def soundNames = soundFiles.files.collect { sound ->
            soundsDir.toPath().relativize(sound.toPath()).toString().replace('\\', '/')
                .replaceFirst(/\.(ogg|mp3)$/, '')
        }.unique().sort()

        def fields = [:]
        soundNames.each { name ->
            def parts = name.split(/[^A-Za-z0-9_$]+/).findAll { !it.isEmpty() }
            def field = parts.isEmpty() ? '' : parts[0].uncapitalize() + parts.drop(1).collect { it.capitalize() }.join()
            if (!SourceVersion.isIdentifier(field) || SourceVersion.isKeyword(field)) {
                throw new GradleException("Sound '${name}' does not produce a valid Java field name.")
            }
            if (fields.containsKey(field)) {
                throw new GradleException("Sounds '${fields[field]}' and '${name}' both produce '${field}'.")
            }
            fields[field] = name
        }

        def source = output.get().asFile
        source.parentFile.mkdirs()
        def declarations = fields.collect { field, name -> "    public static Sound ${field} = new Sound();" }
        def loads = fields.collect { field, name -> "        ${field} = Vars.tree.loadSound(${JsonOutput.toJson(name)});" }
        source.setText("""\
package aquarion.content;

import arc.audio.Sound;
import mindustry.Vars;

// Generated by :tools:generateSounds.
public class AquaSounds {
${declarations.join('\n')}

    public static void load(){
        if(Vars.headless) return;
${loads.join('\n')}
    }
}
""", 'UTF-8')
    }
}

task proc(type: JavaExec) {
    dependsOn classes
    inputs.dir(project.file(spritesRawDir)).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(configurations.runtimeClasspath)
    outputs.dir(project.file(spritesDir))
    outputs.cacheIf { true }

    workingDir = assetsDir
    mainClass.set(rootProject.ext.modName.replaceAll("-", "") + '.tools.Tools')
    classpath = project(':main').sourceSets.main.output + sourceSets.main.runtimeClasspath
    systemProperty 'currentModName', modName

    doFirst {
        delete { delete spritesDir }
        spritesDir.mkdirs()

        copy {
            from spritesRawDir
            into spritesDir
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:-processing']
}

tasks.register('updateBundles') {
    doLast {

        def bundlesDir = new File(rootProject.projectDir, "main/assets/bundles")
        def baseFile = new File(bundlesDir, "bundle.properties")

        def uniEscape = { String string ->
            StringBuilder outBuffer = new StringBuilder()
            int len = string.length()
            for (int i = 0; i < len; i++) {
                char ch = string.charAt(i)
                if ((ch > 61) && (ch < 127)) {
                    outBuffer.append(ch == (char) '\\' ? "\\\\" : ch)
                    continue
                }

                if (ch >= 0xE000 && ch <= 0xF8FF) {
                    String hex = Integer.toHexString((int) ch)
                    outBuffer.append("\\u")
                    for (int j = 0; j < 4 - hex.length(); j++) {
                        outBuffer.append('0')
                    }
                    outBuffer.append(hex)
                } else {
                    outBuffer.append(ch)
                }
            }
            return outBuffer.toString()
        }

        OrderedMap<String, String> base = new OrderedMap<>()
        PropertiesUtils.load(base, Fi.get(baseFile.path).reader())

        // comments + blank lines
        IntMap<String> commentAndBlankLines = new IntMap<>()
        var lines = Fi.get(baseFile.path).reader().readLines()

        int offset = 0
        for (int i = 0; i < lines.size(); i++) {
            var line = lines.get(i)
            if (i > 0 && lines.get(i - 1).endsWith("\\")) offset++
            else if (line.isEmpty() || line.startsWith("#")) {
                commentAndBlankLines.put(i - offset, line)
            }
        }

        Fi.get(bundlesDir.path).walk(child -> {

            if (child.name() == "bundle.properties" ||
                    child.name() == "global.properties") return

            if (project.hasProperty("bundle") && child.name() != project.property("bundle")) return


            OrderedMap<String, String> other = new OrderedMap<>()
            ObjectMap<String, String> extras = new OrderedMap<>()
            Seq<String> removals = new Seq<>()

            PropertiesUtils.load(other, child.reader())

            // remove unused
            for (String key : other.orderedKeys()) {
                if (!base.containsKey(key)) {
                    removals.add(key)
                }
            }

            for (String s : removals) {
                other.remove(s)
            }

            // add missing
            int added = 0
            for (String key : base.orderedKeys()) {
                if (other.get(key) == null || other.get(key).trim().isEmpty()) {
                    other.put(key, base.get(key))
                    added++
                }
            }

            Func2<String, String, String> processor = (key, value) ->
                    (key + " =" + (value.trim().isEmpty() ? "" : " ") + uniEscape(value))
                            .replace("\n", "\\n") + "\n"

            Fi output = child.sibling(child.name())
            output.parent().mkdirs()


            StringBuilder result = new StringBuilder()
            int i = 0

            for (String key : base.orderedKeys()) {
                while (commentAndBlankLines.containsKey(i++)) {
                    result.append(commentAndBlankLines.get(i - 1)).append("\n")
                }

                if (other.get(key) == null) continue

                result.append(processor.get(key, other.get(key)))
                other.remove(key)
            }

            output.writeString(result.toString())
        })
    }
}
