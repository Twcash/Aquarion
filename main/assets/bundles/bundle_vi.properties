aquarion.menu.desc_creator = Này bạn, Tôi đã tạo ra Aquarion, \nTôi yêu Aquarion bởi vì \nTôi tạo ra Aquarion và \nTôi yêu Aquarion rất nhiều \nTôi tạo ra Aquarion và \nTôi chỉ yêu Aquarion nhiều đến thế bởi vì \nTôi đã tạo ra nó. \nVâng, tôi đã tạo ra Aquarion.
aquarion.menu.desc_NikolayKot = Tôi là một lập trình viên. \n\nTôi đã dịch mod này sang tiếng Nga, \nThêm công cụ kiểm tra cập nhật, và tạo ra cái mà bạn đang đọc ngay bây giờ, cũng như là phần trưng bày những người đóng góp khác. \nTôi cũng đã sáng tác nhạc cho mod. \nVà tôi, cũng là Furry Protongen.
aquarion.menu.desc_Thinkerdoodle = Thằn lằn cam. Cô Ấy cũng tự tạo mod và thích tạo bản đồ cho bạn bè trong thời gian rảnh. \n\nĐã tạo ra bản đồ: Rãnh Bị Nhiễm Bệnh, Vùng Đất Hoang Toàn, Bào Tử Nhiệt Đới, Đồi Cây Riparian, Cao Nguyên Nước Mặn, Viền Galen, Cơ Sở Ven Song và Xưởng Ống. \n\n:3
aquarion.menu.desc_Vire = Tôi đã tạo ra một số bản đồ (Cái nào thì đó bài tập dành cho người đọc), và tôi cũng chịu trách nhiệm cho cách trình bày cây công nghệ hiện tại; Tôi cũng đã làm một số thứ khác, nhưng sẽ rất chán nếu tất cả các bất ngờ được tiết lộ.\n[darkgray]Nếu bạn tìm thấy lỗi đánh máy hoặc lỗi bundle khác, ping tôi trên Discord.
aquarion.menu.desc_ItsKirby = Tôi tạo mods Java cho Mindustry. \n\nĐã làm rất nhiều thứ ngẫu nhiên cho Aquarion, từ hiệu ứng hình ảnh của hành tinh cho đến đảm bảo chất lượng sprite. \n\nCảm ơn vì đã tới Ted talk của tôi.
aquarion.menu.desc_Alecthe2nd = Người Modder Java bơi trong cơ sở mã nguồn cho vui. \n\nĐã sửa nhiều lỗi và vấn đề mà Twcash chưa tự sửa được.
aquarion.menu.desc_Leo = Không có
aquarion.menu.desc_Mythril = Tôi đã tạo nhạc cho Aquarion! Tôi cũng từng tạo mods cho Mindustry, nhưng tôi không chắc khi nào tôi sẽ quay lại làm việc đó. \n\nĐừng hỏi tại sao một vật phẩm trong Terraria đột nhiên trở có tri giác lại ở đây.
