block.aquarion-minium-reactor.description = Sử dụng nhiệt từ sương để giảm minium, cho phép oxy kết với lưu huỳnh và Nước. Tạo ra chì và chất thuộc lưu huỳnh trong hóa trình.
block.aquarion-turbine-dynamo.name = Máy Phát Điện Tuabin
block.aquarion-turbine-dynamo.description = Sản xuất một lượng vừa năng lượng bằng việc quay tuabin với [white]sương[] có áp xuất. 
block.aquarion-petroleum-engine.name = Động Cơ Dầu
block.aquarion-petroleum-engine.description = Tiêu thụ một lượng lớn dầu và oxygen dạng khí để đốt hóa chất thành điện.
block.aquarion-fume-engine.name = Động Cơ Khói
block.aquarion-fume-engine.description = Sản xuất một lượng vừa năng lượng từ việc đốt cháy khói.\n[scarlet]Dễ nổ.[]
block.aquarion-pylon.name = Cột Điện
block.aquarion-pylon.description = Kết nối năng lượng tới một số khối. Không thể kết nối với bất kỳ thứ gì tiêu thụ năng lượng.
block.aquarion-pylon.details = Hậu ký - nó kết nối trực tiếp với Pin.
block.aquarion-outlet.name = Ổ Cắm
block.aquarion-outlet.description = Chuyền năng lượng được kết nối tới khối ở trước nó. Cần thiết cho các khối tiêu thụ điện. Nhiều khối này có thể cần thiết do lưu lượng hạn chế.Có thể chuyển đổi bật/tắt bằng việc nháy chuột hoặc chạm.
block.aquarion-energy-bank.name = Ngân Hàng Năng Lượng
block.aquarion-energy-bank.description = Lưu trữ một lượng nhỏ năng lượng.
block.aquarion-capacitor-bank.name = Ngân Hàng Năng Lượng Lớn
block.aquarion-capacitor-bank.description = Lưu trữ một lượng vừa năng lượng. Không thể kết nối với các khối liên quan đến năng lượng bằng phạm vi.
block.aquarion-ion-battery.name = Pin Ion
block.aquarion-ion-battery.description = Lưu trữ một lượng lớn năng lượng. Không thể kết nối với các khối liên quan đến năng lượng bằng phạm vi.
block.aquarion-heat-engine.name = Động Cơ Nhiệt
block.aquarion-heat-engine.description = Sử dụng nhiệt địa để sản xuất năng lượng điện. Sản xuất xỉ như một sản phẩm phụ.
block.aquarion-basic-heat-exchanger.name = Bộ Cơ Đổi Nhiệt Cơ Bản
block.aquarion-basic-heat-exchanger.description = Đun Nước bằng nhiệt ngoài, sản xuất một lượng nhỏ năng lượng với nhiệt lượng dư. Có thể nổ nếu hơi Nước đạt mức tối hạn
block.aquarion-singularity-reactor.name = Lò Phản Ứng Điểm Kỳ Dị
block.aquarion-singularity-reactor.description = Tiêu thụ bất kỳ loại vật phẩm nào để sản xuất năng lượng. Năng lượng được sản xuất tỷ lệ thuẩn với số lượng sản phẩm bỏ vào.
block.aquarion-pnuematic-centrifuge.name = Pnuematic Centrifuge
block.aquarion-pnuematic-centrifuge.description = Deconstructs natural payloads for their base components. Requires air and power to function.
block.aquarion-pnuematic-centrifuge.details = Spinny spinny rock go spin.
block.aquarion-wall-excatavator.name = Cliff Excavator
block.aquarion-wall-excatavator.description = Extracts natural payloads from walls.
block.aquarion-wall-excatavator.details = Walls? But it's a cliff excavator. NOT A WALL EXCAVATOR.
