block.aquarion-initialization-bay.name = Vịnh Khởi Tạo
block.aquarion-initialization-bay.description = Kích hoạt đơn vị chưa được kích hoạt được đặt vào trong. Cần một lượng lớn năng lượng để hoạt động.
block.aquarion-manipulation-bay.name = Vịnh Điều Khiển
block.aquarion-manipulation-bay.description = Chỉnh sửa đơn vị chưa được kích hoạt và áp dụng các trạng thái tăng cường vĩnh viễn.
block.aquarion-payload-pad.name = Bệ Phóng Khối Hàng
