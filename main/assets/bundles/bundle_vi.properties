block.aquarion-inlet.details = Chỉ có thể được dùng trong môi trường ở dưới Nước vì một lý do hiển nhiên.
block.aquarion-inlet-array.name = Mảng Máy Hút Khí
block.aquarion-inlet-array.description = Nén thủy quyển xung quanh cho mục đích công nghiệp. Đầu ra và đầu vào chất lỏng được chia sẻ với Máy hút khí và Mảng Máy hút khí xung quanh.
block.aquarion-inlet-array.details = Chỉ có thể được dùng trong môi trường ở dưới Nước vì một lý do hiển nhiên.
