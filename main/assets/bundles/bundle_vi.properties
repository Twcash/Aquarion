liquid.aquarion-air.description = Một hỗn hợp của hàng loạt loại khí ga.
liquid.aquarion-haze.name = Sương
liquid.aquarion-haze.description = Khí ga siêu nóng. Được dùng trong việc sản xuất năng lượng, phòng thủ, hoặc các hóa trình liên quan đến áp xuất cơ học.
liquid.aquarion-halide-water.name = Nước Halidic 
liquid.aquarion-halide-water.description = Nước với hàm lượng tạp chất cao. Phần lớn tạp chất chứa khí ga thuộc nhóm halide.
liquid.aquarion-petroleum.name = Dầu mỏ
liquid.aquarion-petroleum.description = Dầu tinh tế. Hữu dụng trong việc chế tạo nhựa, nổ, hoặc tập trung vào dầu cốc 
liquid.aquarion-methane.name = Methan
liquid.aquarion-methane.description = Khí hydrocarbon dễ nổ.
liquid.aquarion-cryogen.name = Cryogen
liquid.aquarion-cryogen.description = Khí nén lạnh. Dùng trong việc làm mát hoặc chưng cất chất làm lạnh.
liquid.aquarion-cryogen.details = Không phải cái trong Calamitteeeee...
liquid.aquarion-ammonia.name = Amonia
liquid.aquarion-ammonia.description = Một khí ga nồng với độ dẫn nhiệt cao.
liquid.aquarion-fluorine.name = Fluor
liquid.aquarion-fluorine.description = Khí ga có độ phản ứng cao. Có thể sử dụng để chế tạo nhựa, phòng thủ và sửa chữa khối.
liquid.aquarion-fluorine.details = Khí ga cay.
liquid.aquarion-muriatic-acid.name = Muriatic Acid
liquid.aquarion-muriatic-acid.description = Một Acid được dùng cho một loạt các mục đích khác nhau.
liquid.aquarion-vitriol.name = Dầu Hóa Học
liquid.aquarion-vitriol.description = Một Acid bốc khói được dùng cho một loạt các mục đích khác nhau.
liquid.aquarion-bio-pulp.name = Bùn Sinh Học
liquid.aquarion-bio-pulp.description = Bùn bao gồm vật liệu hữu cơ. Có thể hữu ích trong các công trình tính toán hoặc tinh chế nhiên liệu.
liquid.aquarion-argon.name = Argon
liquid.aquarion-argon.description = Một khí trơ được tìm thấy dồi dào trong Không Khí.
liquid.aquarion-rare-earth-sludge.name = Bùn Đất Hiếm
liquid.aquarion-rare-earth-sludge.description = Một bùn khoáng chất chứa nguyên tố đất hiếm như Ytri và Neodymi.
liquid.aquarion-clear-water.name = Nước Trong
liquid.aquarion-clear-water.description =

## SECTORS
sector.aquarion-Ingress.name = Đi Vào
sector.aquarion-Ingress.description = Cuộc đột kích đầu tiên đến hành tinh mới. Sử dụng [accent]Vòi Dung Nham[] và [accent]Máy Khuếch Táng Dung Nham[] để bắt đầu kinh tế của bạn. Bởi vì giới hạn dung tích phóng, phá dỡ các công trình nội bộ có thể cần thiết.
sector.aquarion-Ecotone.name = Vùng Chuyển Tiếp
sector.aquarion-Ecotone.description = Hồ nước muối có mặt trong phân khu này. Việc này mở cổng cho [accent]Máy Điên Phân Nước Muối[] làm một nguồn hydroxide, cùng với các chất lỏng khác. Điều này, cùng với mạch bô xít lộ thiên, sẽ rất hữu dụng. Sự dồi dào của chất sắt làm cho phân khu này tốt để thử nghiệm với sự sản xuất của [accent]Ferrosilicon[].
sector.aquarion-diseased-cleft.name = Rãnh Bị Nhiễm Bệnh
sector.aquarion-diseased-cleft.description = Crux đã xây dựng một pháo đài ở khe hở nhiễm bệnh. Hạ gục nó.
sector.aquarion-EnsuingTorrent.name = Cơn Lũ Tiếp Theo
sector.aquarion-EnsuingTorrent.description = Những dạng sống kỳ lạ có lẽ lớn hơn một hiện tượng địa phương. Mỏ Azurit trong địa phương sẽ hữu dụng làm một nguồn đồng.
sector.aquarion-CrystalCavern.name = Hang Động Pha Lê
sector.aquarion-CrystalCavern.description = Không có địa nhiệt nào trong khu vực, nguồn năng lượng mới và tài nguyên phải được sử dụng. để dạt được mục đích này, [accent]Động Cơ Khói[], [accent]Máy Khoan Cần Cẩu[] và [accent]Bể Khử Towanite[] sẽ hữu dụng.
sector.aquarion-Grove.name = Rừng
sector.aquarion-Grove.description = Sớm thôi, yêu cầu năng lượng sẽ cao hơn địa nhiệt có sẵn, nhưng bây giờ, nó phải làm. Phân khu này mọc quá nhiều cây so với các phân khu trước. Trụ Buzzsaw sẽ hữu dụng trong việc loại bỏ vật cản, nhưng nó không thể di chuyển. Tuy nhiên đơn vị, có thể di chuyển. Pugnate, hoặc các đơn vị khác mà bạn chọn, có thể bắn các vật cản xuống, nếu như bạn kêu chúng làm.
sector.aquarion-resurgence.name = Hồi Sinh
sector.aquarion-resurgence.description = Một khu vực hoàn hảo để vượt qua phòng thủ quỹ đạo, chiến dịch của chúng ta bắt đầu ở đây.
sector.aquarion-twinPass.name = Đèo Đôi
sector.aquarion-twinPass.description = Tàn tích bỏ hoang rải rác nơi lụi tàn này. Sự dồi dào của các máy phát điện còn hoạt động sẽ cho phép chúng ta tập tròng vào việc sản xuất [accent]Đồng Nickel[].
sector.aquarion-erodedCanyon.name = Hẻm Núi Xói Mòn
sector.aquarion-erodedCanyon.description = Một đội công kích của Crux bảo vệ đường thủy này, đường thủy này cần thiết để truy cập [accent]Cổng Phía Bắc[].
sector.aquarion-fungal-tropics.name = Bào Tử Nhiệt Đới
sector.aquarion-fungal-tropics.description = Một đội tuần tra của Crux tuần tra khu vực này, Chiếm phân khu và đi tiếp.
sector.aquarion-seared-wastes.name = Vùng Đất Hoang Toàn
sector.aquarion-seared-wastes.description = Ở đây có Một đội tuần tra của Crux di chuyển trong những sa mạc kia. Để tiếp tục đi, đội tuần tra này phải bị phá. 
sector.aquarion-floodPlains.name = Đồng Bằng Ngập Lũ
sector.aquarion-floodPlains.description = Đường thủy này cần thiết để truy cập ngã tư chiến lược. Phá hủy và đi tiếp.
sector.aquarion-Lagoon.name = Đầm Phá
sector.aquarion-Lagoon.description = Một địa hình chiến thuật được bảo vệ nghiêm ngặt. Sử dụng chiến thuật để phá hủy, vì kẻ địch có chỗ đứng rất mạnh ở đây.
sector.aquarion-lowlandStrait.name = Eo Biển Đất Thấp
sector.aquarion-lowlandStrait.description = Một quân đội tuần tra đường thủy đã phản bội Crux và bị mắt kẹt ở đây. Phá hủy và đi tiếp.
sector.aquarion-mountainsideComplex.name = Trạm Nghiên Cứu Sườn Núi
sector.aquarion-mountainsideComplex.description = Một nhánh của Crux đang nổ lực để lấy lại vũ khí tiên tiến ở một trạm nghiên cứu được cũng cố. Phá hủy và đi tiếp.
sector.aquarion-riparian-holt.name = Đồi Cây Riparian
sector.aquarion-riparian-holt.description = Một khe núi chật hẹp với rất nhiều cây. Đáng chú ý là nền đất nhỏ tồn tại trong khu vực này. Bọn Gerb đã nắm chúng ta trong một điểm nghiền, chúng ta sẽ bị tấn công từ hai phía.
sector.aquarion-dried-riverbed.name = Lòng Sông Khô
sector.aquarion-dried-riverbed.description = Một tắt nghẽn mạng lưới hậu cần của Crux. Phá hủy đoàn xe của chúng để phá hủy sự nắm giữ của họ đối với khu vực này. Trinh sát sơ bộ đã xác nhận sự có mặt của Đơn vị cấp 5. Chuẩ bị theo đó.
sector.aquarion-frigidShores.name = Bờ Biển Lạnh Giá
sector.aquarion-frigidShores.description = Một đội tấn công đường thủy của Crux đã phong tỏa đường thủy này, ngăn chặn sự truy cập đến Dockyard Complex. Phá hủy và đi tiếp.
sector.aquarion-blastedDockyard.name = Xưởng Tàu Bị Nổ Tung
sector.aquarion-blastedDockyard.description = Một ngôi nhà cũ. Hiện tại đang bị bao vây, đây sẽ thật sự là một thử thách. Từ đây, phóng đến Tantros sẽ khả thi.
sector.aquarion-coupled-basin.name = Lưu Vực Kết Nối
sector.aquarion-coupled-basin.description = Căn cứ của Crux đang hỗ trợ một đội tuần tra đi qua khu vực này. Chiếm phân khu và đi tiếp.
sector.aquarion-lakesideLibrary.name = Thư Viện Ven Hồ
sector.aquarion-lakesideLibrary.description = Chứa đa số kiến thức về phân phối, không có sự hiện diện của kẻ địch. Không cần thiết để vào nơi này.
sector.aquarion-submerged-canyon.name = Hẻm Núi Ngập Nước
sector.aquarion-submerged-canyon.description = Địa nhiệt tồn tại, nhưng không dồi dạo trong phân khu này. Đây là cơ hội tốt để thử Lò Phản Ứng Hydroxide mới.
sector.aquarion-FeldsparRavine.name = Hẻm Núi Feldspar
sector.aquarion-FeldsparRavine.description = Những dạng sống đó đã được quyết định gọi là "Gerb". Có vẻ như họ có phong tục bệnh hoạn, sử dụng xác của đồng minh làm vũ khí. Sử dụng Máy Rửa Biotit để sản xuất Vật Chất Sắt và Nhôm từ Biotit.
sector.aquarion-brine-plateau.name = Cao Nguyên Nước Mặn
sector.aquarion-galenafringe.name = Viền Galen
sector.aquarion-galenafringe.description = Một rãnh rất xâu với hoạt động địa nhiệt cao. Dồi dào trong Nền Galen.
sector.aquarion-violet-valley.name = Thung Lũng Tím
sector.aquarion-violet-valley.description = Một thung lũng chứa đầy bào tử phát triển; Cây Varcaud cao vút trên Dương Xỉ Brulr, Bụi Gai và Bông Rel. Dương Xỉ Kol và Cành Cây Adre mọc đầy trên nền tràn nhập cây cỏ này. Vì lý do chưa rõ, Crux đã gửi một nhóm thám hiểm vào thung lũng này. Kế hoạch của Crux sẽ bị cản trở nếu nhóm thám hiểm này bị phá hủy.
sector.aquarion-frozen-lake.name = Hồ Đống Băng
sector.aquarion-frozen-lake.description = Một phần lớn phân khu này bị chiếm bởi một cái hồ. Khả năng cao là Kẻ địch sẽ có hải quân. Chuẩn bị sẵn sàng. Ở đây thiếu Cát, sử dụng Máy Phân Ly Phế Liệu để sản xuất nó.\n[gray]Đây là một con đường không bắt buộc để mở khóa công nghệ khác. Công cần thiết để hoàn thành chiến dịch.
sector.aquarion-verdant-shallows.name = Nông Xanh Tươi
sector.aquarion-verdant-shallows.description = Một khu vực của Tantros, nơi mà biển đặc biệt nông. Đừng để sự yên tĩnh của phân khu này đánh lừa bạn. Gerb có mặt ở đây.
sector.aquarion-stormy-coast.name = Bờ Biển Bão Tố
sector.aquarion-stormy-coast.description = Phân khu hình như có gần như có bão lớn liên tục. Đáp đất trong khi yên bình và chuẩn bị. Nghiên cứu [accent]Máy Phát Điện Mặt Trời Tiên Tiến[] và [accent]Máy Tạo Lực[]. Thiết lập khiêng một khi mưa bắt đầu là điều khuyến khích.
sector.aquarion-ruined-repository.name = Kho Lưu Trữ Lụi Tàn
sector.aquarion-ruined-repository.description = Một kho lữu trữ chứa kiến thức về máy khoan. Bởi vì tuổi của nó, một số phần đã phân hủy trầm trọng.
sector.aquarion-icy-river.name = Sông Băng
sector.aquarion-icy-river.description = Máy Đốt Chì hữu dụng để bắt đầu nhà máy của bạn, nhưng khi bạn tiên triển thì bạn sẽ cần thêm, cần máy phát điện tốt hơn. Phân khu này chứa một trữ lượng [accent]Lưu Huỳnh[] lớn, cần thiết cho [accent]Lò Phản Ứng Minium[], Bước đầu tiên của bạn đến máy phát điện hiệu quả hơn. Nó sản xuất năng lượng nhiều đáng kể so với Máy Đốt Chì, nhưng cần thiết lập nhiều hơn.
sector.aquarion-whitewoods.name = Gỗ Trắng
sector.aquarion-whitewoods.description = Một rừng thưa thớt ở ven biển với số lượng lớn mỏ Minium trên mặt đất, nhưng rất ít chì. Một vị trí tốt để giúp chúng ta hiểu hơn về Lò Phản Ứng Minium.
sector.aquarion-pipeyard.name = Xưởng Ống
sector.aquarion-pipeyard.description = Cơ sỡ cũ bị xói mòn thành tàn tích. Ở đây thiếu trầm trọng Cát và Silicon, những cách tiên tiến hơn để lấy chúng sẽ cần thiết.
sector.aquarion-waterfrontfacility.name = Waterfront Facility
sector.aquarion-waterfrontfacility.description = The enemy has setup a bunch of bases on the shoreline. Destruction of this facility is yet another means of our advancement.
sector.aquarion-isolated-outpost.name = Isolated Outpost
sector.aquarion-isolated-outpost.description = The enemy has constructed a small outpost in this sector that needs to be eliminated to progress further. The relatively secluded location means that it is unlikely the enemy will retaliate in any meaningful way if it is captured.
sector.aquarion-basaltic-passageways.name = Basaltic Passageways
sector.aquarion-basaltic-passageways.description = A craggy basaltic region intertwined with structures of those who came before us exists within this sector. The terrain here, albeit not the most suitable for production, serves as a good starting location for the production of ferrosilicon. Research materials dependent on ferrosilicon and defeat the enemy.

