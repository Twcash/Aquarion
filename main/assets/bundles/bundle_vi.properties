block.aquarion-solar-generator.name = Máy Phát Điện Mặt Trời
block.aquarion-solar-generator.description = Sản xuất năng lượng từ phóng xạ mặt trời. Pin có thể cần thiết để đối trọng chu kỳ ánh sáng của hành tinh.\n[scarlet]Dễ nổ,đặt với sự quan tâm.[]
