block.aquarion-force-generator.name = Máy Tạo Lực
block.aquarion-force-generator.description = Tạo ra một cái khiên yếu để bảo vệ các khối trong phạm vi. Phần lớn được dùng để bảo vệ các khối nguy hiểm khỏi thời tiết thất thường.
block.aquarion-improvised-explosive.name = Thiết Bị Nổ Tự Chế 
block.aquarion-improvised-explosive.description = Một thiết bị nổ được làm một cách thô sơ được dùng cho việc phá hủy địa hình. Có thể phá hủy một số vật liệu và công trình. Sử dụng cẩn thận.
block.aquarion-cache.name = Chổ Dấu
block.aquarion-cache.description = Lưu trữ một lượng lớn vật phẩm. Có thể mở rộng sức chứa của lõi. 
block.aquarion-cache.details = Hữu dung trong việc lọc vật phẩm trong hóa trình sản xuất nhiều vật phẩm.
block.aquarion-crate.name = Thùng
block.aquarion-crate.description = Lưu trữ một lượng nhỏ tài nguyên. Cần Điểm dỡ hàng để truy cập tài nguyên được lưu trữ trong đó. Sẽ không tăng sức chứa của lõi.
block.aquarion-build-cairn.name = Mồ Xây Dựng
block.aquarion-build-cairn.description = Hỗ trợ trong công trình xây dựng khối và xây dựng lại. Có thể được sử dụng để hỗ trợ trong việc sản xuất đơn vị và xây dựng lại khối.
block.aquarion-construction-tower.name = Tháp Thi Công
block.aquarion-construction-tower.description = Hỗ trợ trong công trình xây dựng khối và xây dựng lại trong một phạm vi rộng. Có thể được sử dụng để hỗ trợ trong việc sản xuất đơn vị và xây dựng lại khối.
block.aquarion-mend-pyre.name = Bãi Sửa Chữa
block.aquarion-mend-pyre.description = Sửa các khối dần theo thời gian và hiệu ứng có thể chồng với các nguồn sửa chữa khác. Cần thiết để bảo trì ống bị tan chảy. Sử dụng năng lượng để hoạt động. Có thể dựa vào để đóng vai trò tấn công khi có nguy hiểm tới gần.
block.aquarion-mend-pyre.details = Không sử dụng Dung Nham để hoạt động. Trở nên xấu xa.
block.aquarion-mend-pylon.name = Cột Sửa Chữa
block.aquarion-mend-pylon.description = Sửa các khối dần theo thời gian và hiệu ứng có thể chồng với các nguồn sửa chữa khác. Cần thiết để bảo trì ống bị tan chảy. Sử dụng khói và năng lượng để hoạt động. Có thể dựa vào để đóng vai trò tấn công khi có nguy hiểm tới gần.
block.aquarion-mend-pylon.details = Rất xấu xa ...
block.aquarion-mend-substation.name = Trạm Sửa Chữa
block.aquarion-mend-substation.description = Sửa các khối dần theo thời gian và hiệu ứng có thể chồng với các nguồn sửa chữa khác. Cần sương và năng lượng để duy trì một khu vực lớn. Có thể đóng vai trò trong việc kiểm soát đám đông
block.aquarion-mend-substation.details = Siêu xấu xa.
block.aquarion-deflector-well.name = Hồ Phản Đạn
block.aquarion-deflector-well.description = Sử dụng công nghệ cổ xưa để tạo ra một lá khiên để chuyển hướng đạn của kẻ địch.
block.aquarion-deflector-well.details = [#3e1313]FETCH: LỖI NGHIÊM TRỘNG Ở 0.121?[]\n[#3e1313]Loại tài liệu không khớp với phần mềm hiện tại của bạn.\nTham chiếu dữ liệu nhà sản xuất và điều khoản dịch vụ để xem loại tài liệu tương thích.[]
