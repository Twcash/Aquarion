campaign.aquarion-fakeSerpulo = Serpulo, hành này mà chiến dịch này sẽ bắt đầu trên. Bạn sẽ tìm thấy kẻ thù cũ và đồng minh mới. Nghiên cứu và sau đó mở rộng sang Erekir và Tantros.
campaign.aquarion-delubrum = Một Thế giới thư viện. Hành tinh này sẽ giữ thông tin hữu dụng, và không có kẻ địch nào. phân khu của nó sẽ mở khóa khi bạn tiến triển chiến dịch của bạn.

