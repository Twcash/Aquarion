##HINTS

hint.aquarion-ammo = Tuy một số trụ cần vật liệu cấp cao hơn, nhu cầu của chúng được khuyến nghị rằng cần được hiểu đúng cách.\n[accent]Trụ như là Pelt sẽ tiêu thụ một lượng lớn đạn mỗi lần bắn.[]
hint.aquarion-outposts = Một số phân khu sẽ chứa trạm của kẻ địch. Phần lớn chúng sẽ sản xuất đơn vị sau một thời gian.\n[accent]Sau khi chiến thắng trong phân khu và các lực lượng còn lại đã được xử lý, các căn cứ sẽ tự hủy.[]
hint.aquarion-boosting = Một lượng lớn khối liên quan đế sản xuất và chế tạo có thể chấp nhận tăng cường.\n[accent]Sử dụng menu '?' để hiểu tăng cường nào khối có thể dùng.[]
hint.aquarion-solar = Máy Phát Điện Mặt Trời cung cấp một số lượng nhỏ năng lượng như chúng không đáng tin cạy và [scarlet]Dễ nổ.[]\n [accent]Chuyển sang nguồn sản xuất năng lượng khác được khuyến nghị.[]
hint.aquarion-power = NÀY NÀY NÀÀY ĐÂY CHỈ LÀ THỬ NGHIỆM! MỘT THỬ NGHIỆM!!!!! 
hint.aquarion-siphon = Phần lớn khối phân bổ chất lỏng sẽ nhận sát thương theo thời gian khi chất lỏng bên trong có [scarlet]nhiệt độ rất cao[]\n[accent]Sát thương này có thể dễ dàng được hoàn tác bằng bất kỳ khối sửa chữa cơ bản nào.[]


