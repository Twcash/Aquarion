block.aquarion-brass-mixing-pot.name = Nồi Trộn Đồng Thau
block.aquarion-brass-mixing-pot.description = Đúc Đồng và Kẽm để tạo ra Đồng Thau. Có thể được tăng cường với Ni-tơ.
block.aquarion-magma-diffuser.name = Máy Khuếch Táng Dung Nham
block.aquarion-magma-diffuser.description = Tách một mớ nguyên liệu ra từ dung nham.
block.aquarion-biotite-leaching-vessel.name = Máy Rửa biotit
block.aquarion-biotite-leaching-vessel.description = Sử dụng acid muriatic để phân hủy biotit ra thành nhiều nguyên liệu cơ bản hơn.
block.aquarion-geothermal-evaporator.name = Máy Bay Hơi Địa Nhiệt
block.aquarion-geothermal-evaporator.description = Sử dụng địa nhiệt để đun nóng Nước halidic thành muriatic acid và muối.
block.aquarion-nuetralization-vessel.name = Máy Trung Hòa
block.aquarion-nuetralization-vessel.description = Sử dụng acid trung hòa với hydroxide cơ bản để sản xuất Nước và nhiệt.
block.aquarion-bauxite-centrifuge.name = Máy Ly Tâm Bô Xít
block.aquarion-bauxite-centrifuge.description = Tách nguyên tố như Nhôm và vật liệu chứa Sắt từ Bô Xít bằng lực ly tâm.
block.aquarion-ferrosilicon-foundry.name = Xưởng Đúc Ferrosilicon
block.aquarion-ferrosilicon-foundry.description = Hợp kim chất Sắt và Silicon. Cần năng lượng và Nước để hoạt động. Có thể chọn tăng cường với nhiệt dung.
block.aquarion-ferrosilicon-foundry.details = Một hóa trình chậm. Nhiều Máy sản xuất có thề cần thiết để cung cấp nguồn tài nguyên bền vững.
block.aquarion-slag-refinement-array.name = Máy Tinh Chế Xỉ
block.aquarion-slag-refinement-array.description = Tinh chế xỉ sang một số tài nguyên khác.
block.aquarion-azurite-kiln.name = Lò Nung Azurit
block.aquarion-azurite-kiln.description = Làm tan chảy Azurit để lấy đồng và hydroxide.
block.aquarion-ammonia-compressor.name = Máy Nén Amonia
block.aquarion-ammonia-compressor.description = Chuyển đổi hóa học Methan và Nitơ thành Amonia.
block.aquarion-cryogen-conditioner.name = Máy Làm Lạnh Cryogen
block.aquarion-cryogen-conditioner.description = Sử dụng vòng lặp làm lạnh bằng Amonia để làm siêu lạnh không khí thành Cryogen lỏng.
block.aquarion-halite-refinery.name = Máy Dun Halite
block.aquarion-halite-refinery.description = Đun Halite để tách tạp chất, sản xuất Muối và Kali. Cần Nước và năng lượng để hoạt động. Sản xuất sương dưới dạng một sản phẩm phụ.
block.aquarion-towanite-reduction-vat.name = Bể Khử Towanite
block.aquarion-towanite-reduction-vat.description = Giảm Towanite xuống thành những thành phần cơ bản. Cần khói để hoạt động.
block.aquarion-fume-mixer.name = Máy Trộn Khói
block.aquarion-fume-mixer.description = Tạo khói tổng hợp để phục vụ mục đích của khói...
block.aquarion-galena-crucible.name = Nồi Nấu Galen
block.aquarion-galena-crucible.description = Giảm Pha Lê Galen về thành phần cơ bản của nó, bao gồm đồng, Chì và Lưu Huỳnh.
block.aquarion-metaglass-pulverizer.name = Máy Nghiền Thủy Tinh
block.aquarion-metaglass-pulverizer.description = Nghiền Thủy Tinh về Chì và Silicon. Sản xuất một phần Oxy dưới dạng sản phẩm phụ.
block.aquarion-fume-separator.name = Máy Phân Tách Khói
block.aquarion-fume-separator.description = Tách vỡ khói ra một số thành phần hữu dụng của nó.
block.aquarion-cooling-tower.name = Tháp Giải Nhiệt
block.aquarion-cooling-tower.description = Sử dụng năng lượng để giải nhiệt sương về Nước. Nhiệt được chuyển về một hướng
block.aquarion-solar-boiler.name = Máy Đun Nước Bằng Năng Lượng Mặt Trời
block.aquarion-solar-boiler.description = Sử dụng phóng xạ mặt trời để đun Nước.
block.aquarion-solid-boiler.name = Máy Đun Nhiên Liệu
block.aquarion-solid-boiler.description = Sử dụng chất rắn dễ cháy để đun Nước. Đầu ra và đầu vào được chia sẻ với tất cả các máy đun nhiên liệu bên cạnh.
block.aquarion-solid-boiler.details = Đang mong chờ điều gì đó khác?
block.aquarion-scrap-centrifuge.name = Máy Ly Tâm Phế Liệu
block.aquarion-scrap-centrifuge.description = Sử dụng lực ly tâm để tách một số vật liệu cơ bản của phế liệu.
block.aquarion-cupronickel-alloying-crucible.name = Nồi Nấu Hợp Kim Đồng Nickel
block.aquarion-cupronickel-alloying-crucible.description = Hợp kim Đồng với Niken để tạo Đồng Nickel. Cần không khí để hoạt động. Có thể được tăng cường bằng nhiệt và/hoặc Nitơ
block.aquarion-metaglass-annealing-furnace.name = Lò Ủ Thủy Tinh
block.aquarion-metaglass-annealing-furnace.description = Ủ Chì và Cát để tạo ra Thủy Tinh. Có thể được cường với nhiệt và/hoặc Minium, nhưng cần không khí để làm mát.
block.aquarion-thermal-cracking-unit.name = Máy Chưng Cất Bằng Nhiệt
block.aquarion-thermal-cracking-unit.description = Chung cất dầu thô thành các thành phần cơ bản hơn để tinh chế thêm.
block.aquarion-polymer-press.name = Máy Nén Polymer
block.aquarion-polymer-press.description = Sử dụng nhiệt độ rất cao và áp suất để trùng hợp hóa Dầu Mỏ lỏng.
block.aquarion-silicon-oxidator.name = Máy Oxy Hóa Silicon
block.aquarion-silicon-oxidator.description = Tạo phản ứng giữa Silicon với Oxygen. Sản xuất Cát.
block.aquarion-arc-furnace.name = Lò Hồ Quang
block.aquarion-arc-furnace.description = Sử dụng điện áp cực kỳ cao để đun nóng Cát. Sản xuất Silicon và Oxy
block.aquarion-haze-cracking-unit.name = Máy Chung Cất Bằng Sương
block.aquarion-haze-cracking-unit.description = Sử dụng Sương để tinh chế Dầu Mỏ thành Polymer. Sản xuất sản phẩm phụ là Amonia.
block.aquarion-desulferization-assembly.name = Mảng Máy Khử Lưu Huỳnh
block.aquarion-desulferization-assembly.description = Khai thác Lưu huỳnh từ Dầu Mỏ Lỏng, sản xuất sản phẩm phụ Methan. Cần nhiệt để hoạt động.
block.aquarion-coal-liquefactor.name = Máy Hóa Lỏng Than
block.aquarion-coal-liquefactor.description = Tạo Dầu tổng hợp từ Than, Oxy và nhiệt.
block.aquarion-vacuum-freezer.name = Tủ Đông Chân Không
block.aquarion-vacuum-freezer.description = Làm lạnh Nước không tinh khiết vượt điểm sương, bắt buộc tạp chất phài rời ra.
block.aquarion-acuminite-degredation-array.name = Mảng Máy Phân Hủy Acuminit
block.aquarion-acuminite-degredation-array.description = Phân hủy pha lê Acuminit thành những thành phần chính bao gồm Stronti, Nhôm và Fluor
block.aquarion-atmospheric-centrifuge.name = Máy Ly Tâm Khí Quyển
block.aquarion-atmospheric-centrifuge.description = Tách thành phần của Không Khí bằng lực ly tâm. Độ kém hiệu quả cao.
block.aquarion-blast-furnace.name = Lò cao
block.aquarion-blast-furnace.description = Sản xuất Thép từ một lượng lớn Chất Chứa Sắt, Oxy và Than. Hiệu quả có thể được gia tăng với Argon.
block.aquarion-brine-mixer.name = Máy Trộn Nước Muối
block.aquarion-brine-mixer.description = Produces brine from mixing large quantities of water and salt.
block.aquarion-electrolysis-vat.name = Máy Điện Phân Nước
block.aquarion-electrolysis-vat.description = Sử dụng Điện phân để tách Nước thành khí Hydro và Oxy. Đầu ra vào của chất lỏng được chia sẻ với tất cả các Máy Điện Phân Liền Kề*.
block.aquarion-electrolysis-vat.details = *Oxy chỉ được chia sẻ trong hướng của đầu ra Oxy, điều tương tự cho Hydro. Nước được chia sẻ ở mọi hướng.
block.aquarion-brine-electrolysis-manifold.name = Máy Điên Phân Nước Muối
block.aquarion-brine-electrolysis-manifold.description = Điện phân Nước Muối sang những thành phần tinh khiết hơn. Như Chlỏ, Hydro và Hydroxide.
block.aquarion-spore-processor.name = Máy Xử Lý Bào Tử
block.aquarion-spore-processor.description = Trộn bào tử thành bùn.
block.aquarion-gasifier.name = Máy Hóa Ga
block.aquarion-gasifier.description = Đun nóng bùn sinh học thành than, nhiệt nhung và sương.
block.aquarion-ultramafic-refinery.name = Máy Tinh Luyện Đá Siêu Mafic
block.aquarion-ultramafic-refinery.description = Nghiền Serpentine thành nguyên liệu cơ bản.
block.aquarion-convection-heater.name = Máy Nhiệt Đối Lưu
block.aquarion-convection-heater.description = Sử dụng đối lưu nhiệt của Nước để sản xuất một lượng nhỏ nhiệt.
block.aquarion-solid-heater.name = Máy Nhiệt Đốt Nguyên Liệu Rắn
block.aquarion-solid-heater.description = Đốt chất rắn với Oxy để tạo ra nhiệt.
block.aquarion-combustion-heater.name = Máy Nhiệt Đốt Chất Lỏng
block.aquarion-combustion-heater.description = Sử dụng nhiệt dư của việc đốt cháy chất lỏng để sản xuất một lượng nhỏ nhiệt.
block.aquarion-heat-channel.name = Mát Chuyền Nhiệt
block.aquarion-heat-channel.description = Chuyền nhiệt nhung cho khối ở phía trước. [scarlet]Sẽ tan tảy ở nhiệt độ cao hơn![].
block.aquarion-filter.name = Máy Lọc
block.aquarion-filter.description = Lọc Nước thường sang Nước trong, Nước trong có thể cung cấp giải nhiệt tốt hơn cho trụ. Máy này giam giữ và thu thập và hạt rắn, sản xuất cát và bụi (đồng, chì, silicon, nickel)
block.aquarion-rotary-kiln.name = Lò Quay
block.aquarion-rotary-kiln.description = Trộn Cát, Canxi và Kali với Nước và không khí để tạo ra Xi Măng

