unit.aquarion-rampart.name = Rampart
block.aquarion-rampart-inactive.name = Rampart
unit.aquarion-rampart.description = Một đơn vị trên mặt đất với tốc độ trung bình. Rất dễ bị tổn thương do đòn tấn công nhanh.
block.aquarion-rampart-inactive.description = Một đơn vị trên mặt đất với tốc độ trung bình. Rất dễ bị tổn thương do đòn tấn công nhanh.

