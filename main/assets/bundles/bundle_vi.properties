lakeside-library-card-reader = Đây là Máy Đọc Thẻ. Ở đây bạn có thể nhặt Thẻ Thư Viện, thứ này cần thiết để đi đến phân khu tiếp theo. Chỉ cần bỏ nó vào lõi và bạn đã sẵn sàng để đi!

