block.aquarion-rampart-inactive.description = Unidad terrestre moderadamente rápida. Posee lenta velocidad de rotación. Ataca a unidades terrestres y aéreas con un cañón automático.

unit.aquarion-byte.name = Byte
block.aquarion-byte-inactive.name = Byte 
unit.aquarion-byte.description = Unidad aérea débil que repara automáticamente estructuras dañadas. Requiere petróleo crudo para activarse. Suelta chispas su activación, por lo que puede causar un incendio.
block.aquarion-byte-inactive.description = Unidad aérea débil que repara automáticamente estructuras dañadas. Requiere petróleo crudo para activarse. Suelta chispas su activación, por lo que puede causar un incendio

unit.aquarion-pugnate.name = Pugnate
block.aquarion-pugnate-inactive.name = Pugnate
unit.aquarion-pugnate.description = Unidad terrestre cuadrúpeda rápida capaz de cruzar sobre pequeñas porciones de terreno y estructuras. Posee corto alcance, pero dispara proyectiles penetrantes a unidades terrestres y aéreas.
block.aquarion-pugnate-inactive.description = Unidad terrestre cuadrúpeda rápida capaz de cruzar sobre pequeñas porciones de terreno y estructuras. Posee corto alcance, pero dispara proyectiles penetrantes a unidades terrestres y aéreas

unit.aquarion-crest.name = Crest
