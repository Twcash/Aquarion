## MESSAGES

delubrum-no-enemy = [accent]No hay enemigos presentes.

resurgence-nohelp = [accent]No habrá información en este planeta. Delubrum contiene toda la información que buscas...
resurgence-lab = Laboratorio de investigación. Los componentes para desbloquear nuevos planos deben ser 'aniquilados' en laboratorios de investigación para obtener datos e información para enviar al "Ojo".
feldspar-ravine-obtain-resources = El [accent]Separador de biotita[] es una vía. Transforma la [accent]Biotita[] restante en recursos usables.\nObtén los recursos restantes para construir uno.
feldspar-ravine-build-biotite-leacing-vessel = Puedes construirlo aquí. Para hacerlo funcionar,\nintroduce [accent]Biotita[] de los\n[accent]Difusores de magma[]. No olvides añadir\n[accent]Ácido muriático[]
crystal-caverns-opening-1 = Nuestros predecesores tuvieron poca\nactividad en esta región.
crystal-caverns-opening-2 = Esto significa que tendrás que\nempezar la economía\npor tu cuenta.
crystal-caverns-opening-3 = Esto nos brinda la oportunidad perfecta\npara probar nuestra nueva\ntegnología de\ngeneración eléctrica.
crystal-caverns-fume-engine = Usa la turbina de\nemisiones para generar\nelectricidad. Construlle una.
crystal-caverns-battery = Como tu generación de energía\nno es estable,\nes recomendado\nutilizar baterías para\napaciguar los picos de menor generación.
ingress-welcome = Este es[cyan] Tantros[].
ingress-decon = Comienza deconstrullendo las estructuras [#655a5a]Abandonadas[].\n[accent]Deconstruir estructuras devuelve todos los materiales.
ingress-magTap = [accent] Los extractores de lava[] requieren ser construidos sobre[#d24040] suelo de magma[].
ingress-magDif = Construlle un [accent]Difusor de lava[].\nEste bloque requiere [#d24040]Lava[] para funcionar.
ingress-goodLuck = Usa [accent]Sifónes[] para conectar estructuras.\nLos [accent]sifónes[] se desgastarán al contener fluidos calientes como la [accent]Lava[].\nUsa [accent]Postes de reparación[] para contrarrestarlo.
torrent-azurite = La [royal]Azurita[] es un cristal que contiene [accent]Cobre[], usa [accent]Extractores plasma[] para extraerlo.\n Usa el [accent]Crisol de azurita[] para refinar este recurso.

lakeside-library-failure = Nosotros nunca buscamos triunfar, sino preparar el terreno para que tú pudieras.
lakeside-library-power-connect = Estructuras consumidoras de electricidad (Como se muestra con esta Entrada de aire) no pueden conectarse al sistema electroenergético al estar adyacente a baterías, postes u otras estructuras consumidoras.
lakeside-library-outlet = Conector de entrada eléctrica
lakeside-library-multiple-outlets = Muchas estructuras (Como el horno de recocido de metacristal) necesitan más de un conector de entrada eléctrica para abastecerse completamente de energía.
lakeside-library-more-libraries = Nuevas librerías pueden ser desbloqueadas al progresar en la campaña y en las investigaciones.
lakeside-library-connect-outlet = Por lo tanto, deberás usar conectores de entrada eléctrica para abastecer de energía a las estructuras.
lakeside-library-info-button = Si deseas conocer cuántos conectores requiere una estructur, simplemente presiona el botón [accent] info [?][] y divide el consumo energético entre la salida de cada conector (60 cada uno).
lakeside-library-mixbelt = En zonas estrechas, puedes ligar el contenido de varias cintas en una sola. Sin embargo, necesitarás usar clasificadores para acceder a cada objeto en específico.
lakeside-library-no-item-bridge = Desafortunadamente, no hay puentes para objetos. Cada objeto sólido debe de ser enrutado alrededor de los obstáculos.
lakeside-library-item-distribution = Distribución de objetos
lakeside-library-boost-to-exit = (Sobrevuela para salir)
lakeside-library-siphon-bridges = Puentes de sifón
lakeside-library-siphon-bridges-explanation = Los puentes de sifón permiten transportar fluidos por encima de obstáculos. Los fluidos pueden ser añadidos por el medio de la cadena de puentes.
lakeside-library-valve = Válvula
lakeside-library-valve-explanation = Las válvulas de sifón priorizarán la distribución hacia los lados. Solo cuando estos están llenos, enviarán los fluidos hacia delante. No se pueden conectar a más de 2 bloques consecutivos.
lakeside-library-liquid-melting = Distribución de fluidos: [scarlet]Derretimiento[]
lakeside-library-melting-explanation = Algunos fluidos calientes derretirán los sifónes. Será necesario utilizar reparadores para contrarrestar el daño. El daño es indicado por un efecto de humo.
lakeside-library-card-reader = Este es el lector de tarjetas de la librería. Aquí puedes conseguir una tarjeta de la librería para desbloquear el acceso a otras. Simplemente coloca la tarjeta en el núcleo y selecciona tu próximo destino.

ruined-repository-info-button-reminder = El botón [?] puede revelar secretos de estructuras, unidades o efectos de estado. Si una estructura o unidad (como las enemigas) no aparece en la base de datos, puedes revisarlos en un mundo sandbox.
ruined-repository-mixed-drill-output = Como tal vez\nya habrás notado, tus\ntaladros pueden minar más de\nun recurso\na la vez.
ruined-repository-sorted-drill-output = Puedes separar los\nrecursos como se muestra aquí.
ruined-repository-drill-only-one-sorted-output = Tambien es posible solo\ntomar un tipo de recurso.\nLos taladros seguirán funcionando\nhasta que toda la línea de distribución\nesté llena.
ruined-repository-defunct-drill-drill-one = Los taladros de nuestros predecesores\neran menos avanzados.\nEllos solo podían minar un\ntipo de recurso\na la vez.
ruined-repository-defunct-drill-boost = Una clara ventaja de\ns7s taladros es qu3Is\n[Igh cü`la/!\nopiw4ni5vboere.
ruined-repository-entry-corrupted = [crimson]ERROR\n  \nArchivo corrompido.

