##PLAYER ITEM LOGISTICS
block.aquarion-conveyor-yeeter.name = Propulsor de objetos.
block.aquarion-conveyor-yeeter.description = Lanza objetos a altas velocidades.
block.aquarion-item-hopper.name = Embudo de objetos
block.aquarion-item-hopper.description = Recoje objetos por la parte superior y los distribuye en todas direcciónes.
block.aquarion-tungsten-yeeter.name = Propulsor de tungsteno
block.aquarion-tungsten-yeeter.description = Lanza objetos a velocidades incluso mayores.
block.aquarion-tungsten-hopper.name = Embudo de tungsteno
block.aquarion-tungsten-hopper.description = Recoje objetos por la parte superior y los distribuye en todas direcciónes.
block.aquarion-cremator.name = Cremador
block.aquarion-cremator.description = Aniquila objetos mediante calor extremo. Es un proceso lento, por lo que se necesitarían múltiples cremadores para lidiar con grandes cantidades de materia.
block.aquarion-sealed-conveyor.name = Cinta transportadora sellada
block.aquarion-sealed-conveyor.description = Mueve objetos hacia delante a velocidad moderada.
block.aquarion-armored-sealed-conveyor.name = Cinta transportadora sellada y blindada
block.aquarion-armored-sealed-conveyor.description = Mueve objetos hacia delante a velocidad moderada. Más resistente y no hacepta objetos por los lados si no es mediante otra cinta transportadora.
block.aquarion-sealed-router.name = Enrutador sellado
block.aquarion-sealed-router.description = Un mal necesario. Distribuye los objetos entrantes en tres direcciones diferentes equitativamente. Evite colocarlo junto a fábricas que produzcan objetos.
block.aquarion-sealed-distributor.name = Distribuidor sellado
block.aquarion-sealed-distributor.description = Distribuye los objetos entrantes en siete direcciones diferentes equitativamente.
block.aquarion-mass-distributor.name = Distribuidor masivo
block.aquarion-mass-distributor.description = Distribuye los objetos entrantes en quince direcciones equitativamente.
block.aquarion-sealed-junction.name = Cruze sellado
block.aquarion-sealed-junction.description = Permite que dos cintas transportadoras se cruzen sin que intercambien objetos entre ambas.
block.aquarion-sealed-unloader.name = Descargador sellado
block.aquarion-sealed-unloader.description = Descarga el objeto seleccionado de la estructura que tenga detrás y lo distribuye hacia delante. Si no se especifica un objeto, descargará cualquier objeto de la estructura. Posee gran variedad de usos.
block.aquarion-sealed-sorter.name = Clasificador sellado
block.aquarion-sealed-sorter.description = El objeto seleccionado será redirigido hacia los lados, el resto continuará su camino hacia delante.
block.aquarion-sealed-inverted-sorter.name = Clasificador invertido sellado
block.aquarion-sealed-inverted-sorter.description = Solo el objeto seleccionado podrá avanzar hacia delante. El resto será redirigido hacia los lados.
block.aquarion-sealed-overflow.name = Compuerta de desbordamiento sellada
block.aquarion-sealed-overflow.description = Cuando el flujo de objetos hacia delante se obstrulle, los redirigirá hacia los lados.
block.aquarion-sealed-underflow.name = Compuerta de subdesbordamiento sellada.
block.aquarion-sealed-underflow.description = Redirige los objetos entrantes hacia los lados, pero cuando estos se obstrullen, permitirá que avancen hacia delante.
block.aquarion-steel-conveyor.name = Cinta transportadora de acero
block.aquarion-steel-conveyor.description = Mueve objetos por lotes masivos.
block.aquarion-steel-conveyor.details = Para cuando necesitas mover una cantidad MASIVA de objetos
block.aquarion-steel-router.name = Enrutador de acero
block.aquarion-steel-router.description = Distribuye los lotes de las cintas transportadoras de acero en tres direcciones diferentes con rapidez.


