item.aquarion-arsenic.description = Elemento cristalino utilizado para diversos fines.
item.aquarion-arsenic.details = Si se supone que no debo comerlo, ¿por qué se ve tan delicioso?
item.aquarion-zinc.name = Zinc
item.aquarion-zinc.description = Elemento metálico quebradizo similar al magnesio, resistente a la corrosión.
item.aquarion-biotite.name = Biotita
