## BLOCKS

##PLAYER TURRETS

block.aquarion-meteor.name = Meteor
block.aquarion-meteor.description = Un misil que se debe construir sobre el terreno. Al ser suministrado con energía, se dispara automáticamente si un enemigo entra en su rango de acción. Posee un alcance y daño en área moderado, pero es incapaz de atacar unidades aéreas.
block.aquarion-vesta.name = Vesta
block.aquarion-vesta.description = Un misil que se debe construir sobre el terreno. Al ser suministrado con energía, se dispara automáticamente si un enemigo entra en su rango de acción. Posee un largo alcance y potente daño en área, pero es incapaz de atacar unidades aéreas.
block.aquarion-point.name = Point
block.aquarion-point.description = Dispara una descarga dispersa de metralla sobrecalentada.
block.aquarion-volt.name = Volt
block.aquarion-volt.description = Dispara arcos eléctricos con una cadencia elevada. Posee un corto alcance y solo ataca unidades terrestres.
block.aquarion-volt.details = Me pregunto qué efecto tiene esa probabilidad del 1%...
block.aquarion-pelt.name = Pelt
block.aquarion-pelt.description = Dispara una jabalina perforante contra los enemigos.
block.aquarion-concuss.name = Concuss
block.aquarion-concuss.description = Dispara misiles debilitantes con baja velocidad de desplazamiento. Posee una mala precisión.
block.aquarion-suffocate.name = Suffocate
block.aquarion-suffocate.description = Lanza grandes cantidades de material sólido y compacto contra los enemigos. Puede extinguir incendios si se le suministra la munición adecuada.
block.aquarion-vector.name = Vector
block.aquarion-vector.description = Dispara ráfagas de discos contra los enemigos.
block.aquarion-truncate.name = Truncate
block.aquarion-truncate.description = Dispara granadas adhesivas que liberan gas metano explosivo. Solo ataca a objetivos terrestres.
block.aquarion-perforate.name = Perforate
block.aquarion-perforate.description = Dispara una poderosa ráfaga de proyectiles contra el enemigo.
block.aquarion-perforate.details = ¡No dejes que te acierten en la cabeza!
block.aquarion-aftershock.name = Aftershock
block.aquarion-aftershock.description = Dispara una lluvia de metralla fundida contra los enemigos. Extremadamente poderoso a corto alcance.
block.aquarion-sentry.name = Sentry
block.aquarion-sentry.description = Arma defensiva que dispara a los proyectiles enemigos con el objetivo de destruirlos.Inefectivo contra proyectiles rápidos, pero puede destruir con facilidad proyectiles lentos como los de artillería.No ataca ni a los enemigos, ni a misiles de gran tamaño como el Meteor o el Vesta.
block.aquarion-thrash.name = Thrash
block.aquarion-thrash.description = Poderoso Obús capaz de disparar poderosas ojivas altamente explosivas. Posee un gran alcance, pero no puede atacar objetivos aéreos
block.aquarion-flagellate.name = Flagellate
block.aquarion-flagellate.description = Una poderosa pieza de artillería de dos cañones, capaz de disparar devastadoras ojivas explosivas sobre una vasta distancia. Solo capaz de atacar objetivos terrestres.
block.aquarion-dislocate.name = Dislocate
block.aquarion-dislocate.description = Ametralladora de alta cadencia de fuego, dispara proyectiles explosivos que expulsan metralla. Posee baja precisión
block.aquarion-refraction.name = Refraction
block.aquarion-refraction.description = Concentra un devastador láser contra unidades aéreas. Puede enfrentar fácilmente naves veloces.
block.aquarion-refraction.details = Recuerdo a esta vieja amiga de forma muy distinta... Bienvenida de vuelta, Refraction.
block.aquarion-douse.name = Douse
block.aquarion-douse.description = Lanza sobre el enemigo un chorro de líquido en un amplio arco. Puede afectar al enemigo de diversas formas en dependencia de la sustancia suministrada. Puede apagar incendios si se le suministra agua.
block.aquarion-foment.name = Foment
block.aquarion-foment.description = Dispara proyectiles perseguidores al enemigo. Alcance modesto.
block.aquarion-grace.name = Grace
block.aquarion-grace.description = Pieza de artillería cullos proyectiles poseen efectos diferentes en dependencia de la munición suministrada. Requiere energía y gran cantidad de agua para su debido funcionamiento. No ataca a unidades aéreas.
block.aquarion-redact.name = Redact
block.aquarion-redact.description = Dispara potentes proyectiles de largo alcance contra los enemigos.
block.aquarion-focus.name = Focus
block.aquarion-focus.description = Dispara un láser concentrado contra el enemigo. Largo alcance.
block.aquarion-maelstrom.name = Maelstrom
block.aquarion-maelstrom.description = Dispara una ráfaga de projectiles perseguidores débiles contra enemigos aéreos. Funciona con emisiones geológicas.
block.aquarion-torrefy.name = Torrefy
block.aquarion-torrefy.description = Dispara un láser masivo penetrante capaz de sublimar hasta el blindaje más grueso. Tiene un largo tiempo de carga.
block.aquarion-torrefy.details = ¿Hace falta decir algo más?. Pues entonces que el arma hable por si misma.
block.aquarion-buzzsaw.name = Buzzsaw
block.aquarion-buzzsaw.description = Un brazo mecánico con una sierra incorporada. Útil para destruir escombros, árboles y restos de unidades.
block.aquarion-javelin.name = Javelin
block.aquarion-javelin.description = Ametralladora anti-aérea que dispara proyectiles de alta velocidad. 
block.aquarion-confront.name = Confront
block.aquarion-confront.description = Ametralladora de cuatro cañones con alta codencia de fuego y largo alcance.


