## LIQUIDS
liquid.aquarion-brine.name = Salmuera
liquid.aquarion-brine.description = Una solución líquida con alto contenido en sal. Se usa para producir hidróxido y sal.
liquid.aquarion-brine.details = No puedo hacer pepinillos con esto. Que desagradable.
liquid.aquarion-hydroxide.name = Hidróxido
liquid.aquarion-hydroxide.description = Solución básica altamente reactiva usado para la generación de energía y en procesamientos intermedios.
liquid.aquarion-hydroxide.details = Limpiador de drenajes. Efectivo en la neutralización de ácidos.
liquid.aquarion-chlorine.name = Cloro
liquid.aquarion-chlorine.description = Un elemento del grupo de los halógenos.
liquid.aquarion-oxygen.name = Oxígeno
liquid.aquarion-oxygen.description = Usado en diversas reacciones. Usualmente obtenido como sub-producto en diversos procesos.
liquid.aquarion-magma.name = Lava
liquid.aquarion-magma.description = Roca fundida del corazón de un planeta que sangra.
liquid.aquarion-magma.details = NOTA: Si escuchas a las cintas explotando, esta es la causa más probable, o las emisiones volcánicas.
liquid.aquarion-fumes.name = Emisiones volcánicas
liquid.aquarion-fumes.description = Una densa mezcla de gases altamente reactivos. Usualmente se extraen de conductos geotérmicos, pero también puede ser recreado artificialmente.
liquid.aquarion-fumes.details = Ni yo se qué es esta cosa...
liquid.aquarion-air.name = Aire
liquid.aquarion-air.description = Mezcla de varios gases dispersos en la atmósfera.
liquid.aquarion-haze.name = Vapor
liquid.aquarion-haze.description = Agua en estado gaseoso super calentado mezclado con algunos gases extra para añadir densidad. Se usa en la generación de electricidad, defensas y en prosesos mecánicos operados mediante altas presiones.
liquid.aquarion-halide-water.name = Agua halogenada
liquid.aquarion-halide-water.description = Agua con un alto contenido de impurezas. Entre esas impurezas se encuentran sustancias del grupo de los halógenos.
liquid.aquarion-petroleum.name = Petróleo refinado
liquid.aquarion-petroleum.description = . Usado en la síntesis de polímeros, combustión, o concentrado en coque de petróleo.
liquid.aquarion-methane.name = Metano
liquid.aquarion-methane.description = Gas inflamable del grupo de los hidrocarburos.
liquid.aquarion-cryogen.name = Sustancia criogénica
liquid.aquarion-cryogen.description = Gases fríos comprimidos. Usado en refrigeración o en destilación criogénica.
liquid.aquarion-cryogen.details = No es el de Terraria...
liquid.aquarion-ammonia.name = Amoniaco
liquid.aquarion-ammonia.description = Un gas con una exelente conductividad termal.
liquid.aquarion-fluorine.name = Flúor
liquid.aquarion-fluorine.description = Gas altamente reactivo. Usado en la síntesis de plásticos, defensas y reparación estructural.
liquid.aquarion-fluorine.details = Gas picante.
liquid.aquarion-muriatic-acid.name = Ácido muriático
liquid.aquarion-muriatic-acid.description = Un ácido con una amplia gama de usos.
liquid.aquarion-vitriol.name = Aceite de vitriolo
liquid.aquarion-vitriol.description = Un ácido usado en una amplia gama de procesos.
liquid.aquarion-bio-pulp.name = Pasta biológica
liquid.aquarion-bio-pulp.description = Pasta creada a partir de materia orgánica. Puede ser usado en ciencia computacional avanzada y en refinamiento de combustibles.
liquid.aquarion-argon.name = Argón
liquid.aquarion-argon.description = Un gas inerte encontrado en el \ue955 [#c1c1c1]Aire[]
liquid.aquarion-rare-earth-sludge.name = Lodo de tierras raras
liquid.aquarion-rare-earth-sludge.description = Un lodo mineral que contiene minerales de tierras raras como el itrio and neodimio.
liquid.aquarion-clear-water.name = Agua purificada
liquid.aquarion-clear-water.description = Potable :D.

## SECTORS
sector.aquarion-Ingress.name = Ingress
sector.aquarion-Ingress.description = Tu primera incursión en un nuevo planeta. Utiliza extractores y difusores de magma para iniciar con el establecimiento de infraestructura.
sector.aquarion-Ecotone.name = Ecotone
sector.aquarion-Ecotone.description = Con salmuera presente en este sector, la electrólisis de salmuera puede ser utilizada para generar electricidad.
sector.aquarion-diseased-cleft.name = Diseased Cleft
sector.aquarion-diseased-cleft.description = Los Crux han construido una bastión en una zona infestada de esporas. Destrúyela.
sector.aquarion-EnsuingTorrent.name = Ensuing Torrent
sector.aquarion-EnsuingTorrent.description = Esas extrañas formas de vida parecen ser más que un fenómeno local. Utilice los depósitos de azurita para producir cobre.
sector.aquarion-CrystalCavern.name = Crystal Cavern
sector.aquarion-CrystalCavern.description = Sin zonas con calor geotérmico en la zona, nuevas fuentes de energía y recursos han de ser utilizadas. Emplea la turbina de emisiones, el taladro de perforación y la reducción de towanita.
sector.aquarion-Grove.name = Grove
sector.aquarion-Grove.description = Pronto, la demanda de energía superará a la generación por vía geotérmica, será necesario manejar con cuidado la disponibilidad de electricidad. La zona está colmada de obstáculos. La sierra será útil para removerlos automáticamente, pero no puede desplazase. Por otro lado, las unidades tambien pueden destruir los obstáculos, pero solo si se los ordenas.
sector.aquarion-resurgence.name = Resurgence
sector.aquarion-resurgence.description = Un área perfecta para atravesar las defensas orbitales. La conquista inicia aquí.
sector.aquarion-twinPass.name = Twin Pass
sector.aquarion-twinPass.description = Ruinas abandonadas yacen dispersas por todo el lugar. Destruye la patrulla Crux y continua la expansión.
sector.aquarion-erodedCanyon.name = Eroded Canyon
sector.aquarion-erodedCanyon.description = Una patrulla Crux resguarda esta canal, el cual es la vía principal hacia las puertas del norte
sector.aquarion-fungal-tropics.name = Fungal Tropics
sector.aquarion-fungal-tropics.description = Una patrulla Crux vigila esta zona, asegúrala y continúa la expansión.
sector.aquarion-seared-wastes.name = Seared Wastes
sector.aquarion-seared-wastes.description = Una patrulla Crux viaja a travez de este desierto. Para continuar la expansión, es necesario destruirla.
sector.aquarion-floodPlains.name = Floodplains
sector.aquarion-floodPlains.description = Este canal es un acceso a rutas estratégicas. Destruye al enemigo y continúa la expansión.
sector.aquarion-Lagoon.name = Lagoon
sector.aquarion-Lagoon.description = Una formación terrestre altamente defendida. Utiliza estrategias para ganar ventaja frente a la superioridad del enemigo.
sector.aquarion-lowlandStrait.name = Lowland Strait
sector.aquarion-lowlandStrait.description = Una patrulla naval Crux se ha perdido y ha quedado varada en esta zona. Destrúyela y continua la expansión.
sector.aquarion-mountainsideComplex.name = Mountainside Complex
sector.aquarion-mountainsideComplex.description = Los Crux intentan recuperar tecnología militar avanzada en un puesto de investigación fortificado. Destrúyelo y continúa la expansión.
sector.aquarion-riparian-holt.name = Riparian Holt
sector.aquarion-riparian-holt.description = Una ruta estrecha con pequeñas formaciones de tierra yacen aquí. Los Greb nos atacarán por dos vías simultáneamente.
sector.aquarion-dried-riverbed.name = Dried Riverbed
sector.aquarion-dried-riverbed.description = Un cuello de botella en las redes de logística Crux. Destruye su convoy para debilitar su presencia en la región. Exploraciones preliminares indican la presencia de unidades T-5. Prepárate para frenar su avance.
sector.aquarion-frigidShores.name = Frigid Shores
sector.aquarion-frigidShores.description = Una flota naval Crux ha bloqueado esta vía marítima, lo que evita el acceso al complejo de puertos y astilleros. Destrúyela y continua oa expansión.
sector.aquarion-blastedDockyard.name = Blasted Dockyard
sector.aquarion-blastedDockyard.description = Un antiguo hogar, actualmente bajo asedio. Esto será un verdadero desafío.
sector.aquarion-coupled-basin.name = Coupled Basin
sector.aquarion-coupled-basin.description = Fortificaciones Crux brindan apoyo a una patrulla que se mueve por la zona. Destruye la patrulla.
sector.aquarion-lakesideLibrary.name = Lakeside Library
sector.aquarion-lakesideLibrary.description = Almacena conocimiento sobre distribución y logística. No hay enemigos presentes.
sector.aquarion-submerged-canyon.name = Submerged Canyon
sector.aquarion-submerged-canyon.description = Has encontrado una de las rutas de transporte de recursos del enemigo. Utiliza la estructura del cañón para bloquear las patrullas enemigas.
sector.aquarion-FeldsparRavine.name = Feldspar Ravine
sector.aquarion-FeldsparRavine.description = Los Gerb utilizan los cadáberes de sus soldados caidos para crear máquinas de combate. Utiliza el separador de biotita para obtener alumíneo y materia férrea
sector.aquarion-brine-plateau.name = Brine Plateau
sector.aquarion-galenafringe.name = Galena Fringe
sector.aquarion-galenafringe.description = Una trinchera muy profunda con gran actividad geotermal. Rica en formaciones de galena.
sector.aquarion-violet-valley.name = Violet Valley
sector.aquarion-violet-valley.description = Un valle lleno de cúmulos de esporas; Varcaud Stalks se alzan sobre Brulr Fern,  Brambles y Rel Blossoms. Kol Ferns y Adre Sprigs crecen plenamente sobre el suelo rocoso. Por alguna razón, los Crux enviaron una expedición a esta zona. Destrúyela para desmontar los planes de los Crux.
sector.aquarion-frozen-lake.name = Frozen Lake
sector.aquarion-frozen-lake.description = Una gran proporción de este sector se encuentra ocupado por un lago. El enemigo posee presencia naval en la zona. La arena es inexistente en este sector, utiliza centrifugadoras de chatarra para obtenerla.
sector.aquarion-verdant-shallows.name = Verdant Shallows
sector.aquarion-verdant-shallows.description = Una región de Tantros donde el océano es particularmente poco profundo. No permitas que la aparente tranquilidad de este sector te engañe, los Gerb están presentes.
sector.aquarion-stormy-coast.name = Stormy Coast
sector.aquarion-stormy-coast.description = Este sector aparenta estar bajo la influencia constante de tormentas. Aterriza durante la calma y prepárate. Prepara escudos para prevenir el daño provocado por las intensas precipitaciones. 
sector.aquarion-ruined-repository.name = Ruined Repository
sector.aquarion-ruined-repository.description = Aquí se almacena conocimiento sobre taladros. Algunas partes se han degradado signicativamente.
sector.aquarion-icy-river.name = Icy River
sector.aquarion-icy-river.description = Los quemadores de plomo te ayudarán a iniciar la construcción de una base, pero mientras progresas, necesitarás formas mejores de generación de electricidad. Este sector contiene grandes reservas de azufre, el cual es necesario para el reactor de minio: Produce significativamente más electricidad, pero requiere mayor planeación y preparación.
sector.aquarion-whitewoods.name = Whitewoods
sector.aquarion-whitewoods.description = Un bosque costero que contiene grandes cantidades superficiales de minio, pero muy poco plomo. Usa el reactor de minio para obtener cantidades adecuadas de plomo.


