##PLAYER MISC BLOCKS

block.aquarion-lantern.name = Lámpara
block.aquarion-lantern.description = Usa gases o líquidos inflamables para producir grancantidad de luz.

block.aquarion-led.name = Light Emitting Diode
block.aquarion-led.description = Uses a small amount of power to make a meager amount of light.
block.aquarion-force-generator.name = Generador de campo de fuerza
block.aquarion-force-generator.description = Genera un escudo débil para proteger estructuras. Principalmente usado para proteger estructura crítica del clima adverso.
block.aquarion-improvised-explosive.name = Explosivo improvisado
block.aquarion-improvised-explosive.description = Un explosivo utilizado para la destrucción de terreno. Puede destruir ciertos materiales y estructuras. Debe usarse con cuidado.
block.aquarion-cache.name = Contenedor
block.aquarion-cache.description = Almacena gran cantidad de objetos.
block.aquarion-cache.details = Útilpara distribuir objetos en fábricas que produzcan varios tipos de objetos.
block.aquarion-crate.name = Caja
block.aquarion-crate.description = Almacena una pequeña cantidad de objetos. Descargadores son requeridos para retirar los objetos de esta estructura.
block.aquarion-build-cairn.name = Grúa de construcción
block.aquarion-build-cairn.description = Asiste en la construcción de estructuras. Puede reconstruir estructuras destruidas y puede ser usado para automatizar la producción de unidades.
block.aquarion-construction-tower.name = Torre de construcción
block.aquarion-construction-tower.description = Asiste en la construcción de estructuras. Puede reconstruir estructuras destruidas y puede ser usado para automatizar la producción de unidades.
block.aquarion-mend-pyre.name = Poste de reparación
block.aquarion-mend-pyre.description = Repara las estructuras en su campo de acción con el tiempo. Necesario para mantener a raya la degradación de los silitubos por calor intenso. Necesita electricidad para funcionar. Pasa a desempeñar un rol ofensivo cuando el peligro está cerca, pero no puede reparar en ese modo.
block.aquarion-mend-pyre.details = No usa magma para funcionar. Se vuelve malvado.
block.aquarion-mend-pylon.name = Torre de reparación
block.aquarion-mend-pylon.description = Repara las estructuras en su campo de acción con el tiempo. Necesario para mantener a raya la degradación de los silitubos por calor intenso. Necesita electricidad y emisiones volcánicas para funcionar. Pasa a desempeñar un rol ofensivo cuando el peligro está cerca, pero no puede reparar en ese modo.
block.aquarion-mend-pylon.details = Muy malvado...
block.aquarion-mend-substation.name = Faro de reparación
block.aquarion-mend-substation.description = Repara las estructuras en su campo de acción con el tiempo. Necesario para mantener a raya la degradación de los silitubos por calor intenso. Necesita electricidad y vapor para funcionar. Pasa a desempeñar un rol ofensivo cuando el peligro está cerca, pero no puede reparar en ese modo.
block.aquarion-mend-substation.details = Giga-malvado.
block.aquarion-deflector-well.name = Gerador de pantalla reflectora
block.aquarion-deflector-well.description = Usa tecnología arcáica para crear un escudo que redirecciona los proyectiles enemigos.
block.aquarion-deflector-well.details = [#3e1313]FETCH: FATAL ERROR IN 	0.121?S[]\n[#3e1313]File type is incompatible with your current software\nReference manufacturer data and terms of service to view compatible file types.[]
block.aquarion-overclock-projector.name = Proyector de sobrecarga
block.aquarion-overclock-projector.description = Duplica la velocidad de las estructuras a su alcance, pero las daña enormemente en el proceso.

