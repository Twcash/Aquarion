##PLAYER DRILLS

block.aquarion-magma-tap.name = Extractor de lava
block.aquarion-magma-tap.description = Extrae lava de las fisuras volcánicas.
block.aquarion-fume-filter.name = Extractor de emisiones
block.aquarion-fume-filter.description = Extrae emisiones geológicas de los geiseres volcánicos.
block.aquarion-graphite-concentrator.name = Concentrador de grafito
block.aquarion-graphite-concentrator.description = Concentra pequeñas cantidades de grafito a partir de las rocas metamórficas como el basalto.
block.aquarion-ferric-macerator.name = Triturador férreo
block.aquarion-ferric-macerator.description = Corta, tritura y desintegra el suelo férreo con el objetivo de extraer materia férrea. Produce gran cantidad de arena como subproducto y requiere grandes cantidades de agua para funcionar.
block.aquarion-plasma-extractor.name = Extractor plasma
block.aquarion-plasma-extractor.description = Extrae minerales de las paredes que los contiene. Requiere ácido muriático o aceite de vitriolo. Puede ser potenciado con amoníaco.
block.aquarion-beam-bore.name = Perforador de rayo láser
block.aquarion-beam-bore.description = Extrae minerales de las paredes que los contiene, puede ser potenciado con emisiones geológicas.
block.aquarion-drill-derrick.name = Taladro de perforación
block.aquarion-drill-derrick.description = Extrae depósitos superficiales. Requiere vapor para funcionar. Puede ser potenciado con ácido muriático o aceite de vitriolo y es capaz de extraer minerales de gran dureza.
block.aquarion-drilling-rig.name = Complejo de perforación
block.aquarion-drilling-rig.description = Un taladro masivo usado para la extracción de cantidades industriales de recursos de los depósitos del suelo. Requiere vapor para funcionar. Puede ser potenciado con argón.
block.aquarion-harvester.name = Recolector
block.aquarion-harvester.description = Mina recursos del suelo a ritmo constante. Su eficiencia puede ser aumentada suministrándole agua y unidades de cuproníquel.
block.aquarion-air-intake.name = Compresor de aire
block.aquarion-air-intake.description = Extrae y comprime el aire atmosférico y lo pone a disposición para usos industriales.
block.aquarion-air-intake.details = Solo puede ser usado en un ambiente con atmósfera, por ovias razones.
block.aquarion-inlet.name = Entrada de líquidos.
block.aquarion-inlet.description = Extrae y presuriza la hidrósfera y pone sus recursos a disposición para uso industrial. Los líquidos tanto entrantes como salientes se comparten entre todas las entradas de líquidos y conjuntos de entrada de líquidos.
block.aquarion-inlet.details = Solo puede ser usado en regiones sumergidas bajo el agua, por ovias razones.
block.aquarion-inlet-array.name = Conjunto de entrada de líquidos
block.aquarion-inlet-array.description = Extrae y presuriza la hidrósfera y pone sus recursos a disposición para uso industrial. Requiere energía. Los líquidos tanto entrantes como salientes se comparten entre todas las entradas de líquidos y conjuntos de entradas de líquidos.
block.aquarion-inlet-array.details = Solo puede ser usado en regiones sumergidas bajo el agua, por ovias razones.
block.aquarion-pin-drill.name = Taladro de perno
block.aquarion-pin-drill.description = Mina depósitos superficiales.
block.aquarion-algal-terrace.name = Cultivador de algas
block.aquarion-algal-terrace.description = Cultiva colonias de micro-algas para la producción de pasta biológica. Mejora su efeciencia al ser construido sobre suelo rico en nutrientes.
block.aquarion-algal-terrace.details = Incluso en los ambientes más extremos, esta especie de micro-alga parece encontrarse en todas partes. Incluso en el vacio del espacio.

