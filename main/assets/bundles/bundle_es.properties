block.aquarion-armament-mounting.name = Montura de armamento

##TRAINS

block.aquarion-rail-point.name = Rail Point
block.aquarion-rail-point.description = Draws smooth tracks between friendly rail points using both endpoints' rotations and a minimum bend radius. Tracks cannot pass through static walls, other rail points, or cross tracks without a shared rail point. Shaded tiles show valid positions for the rail rotation being placed. Click a placed rail, then another rail to connect or disconnect them. Visual only.
unit.aquarion-path.name = path
unit.aquarion-path.description = Carries cargo across railways.
block.aquarion-cargo-dock.name = Cargo Dock
block.aquarion-cargo-dock.description = A cargo dock where railway units are able to access items and payloads from.
block.aquarion-cargo-depot.name = Cargo Depot
block.aquarion-cargo-depot.description = A Cargo depot allowing railway units to deposit payload and item cargo
rail.train-length = Train length
block.aquarion-rail-junction.name = Railway Junction
block.aquarion-rail-junction.description = Connects railway tracks on all four sides.
block.aquarion-rail-node.name = Railway Node
block.aquarion-rail-node.description = Connects between other railway blocks.
unit.aquarion-gorge.name = Gorge
unit.aquarion-gorge.description = Transports liquids along rails.
block.aquarion-liquid-cargo-dock.name = Liquid Cargo Dock
block.aquarion-liquid-cargo-dock.description = Loads Gorge trains with liquids for requesting depots.
block.aquarion-liquid-cargo-depot.name = Liquid Cargo Depot
block.aquarion-liquid-cargo-depot.description = Unloads the selected liquid from Gorge trains and outputs it to adjacent liquid blocks.
block.aquarion-trainyard.name = Trainyard
block.aquarion-trainyard.description = Builds the selected rail unit: Path, Gorge, or Burden. Requires power and materials.
block.aquarion-rail-coupler.name = Rail Coupler
block.aquarion-rail-coupler.description = Holds and links arriving rail units into a train of the configured length, then dispatches them together. Accepts mixed rail unit types and cargo. Requires power.
block.aquarion-liquid-dock.name = Liquid Dock
block.aquarion-liquid-dock.description = A liquid dock capable of supplying railway units with liquids.
block.aquarion-liquid-depot.name = Liquid Depot
block.aquarion-liquid-depot.description = Capable of receiving the set requested liquid from railway units.
unit.aquarion-burden.name = Burden
unit.aquarion-burden.description = Transports payloads along railways. Capable of utility or combat tasks depending on the payload given.
bar.payload-drillspeed = {0}/s
block.aquarion-liquid-slurper.name = Liquid Slurper
block.aquarion-liquid-slurper.description = Absorbs nearby cool liquid to generate enormous amounts of mass for the colony. Cannot feed on slag or hot liquids.
block.aquarion-vein.name = Vein
block.aquarion-vein.description = Forms narrow strands along busy supply routes. Rapidly balances mass and delivers requested items across the connected colony. Unused veins recede into ordinary tissue.
block.aquarion-tentacle-pit.name = Tentacle Pit
block.aquarion-tentacle-pit.description = Grows from connected neoplasia near damaged allied buildings, consuming 2 pearls and 10 crystals. Lashes enemy units and buildings with a tentacle. Retracts after 30 seconds without threats, returning its construction materials.
block.aquarion-large-tentacle-pit.name = Large Tentacle Pit
block.aquarion-large-tentacle-pit.description = A stronger tentacle pit costing 4 pearls and 20 crystals. Existing pits can upgrade by paying the difference. Retracts after 30 seconds without threats, returning its full construction materials.
block.aquarion-large-blobber.name = Large Blobber
block.aquarion-large-blobber.description = An upgraded blobber that spreads neoplasia with glob projectiles over a longer range. Requires 6 crystals to evolve from a blobber.
