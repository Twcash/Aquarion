block.aquarion-brass-mixing-pot.name = Caldero mezclador de Latón
block.aquarion-brass-mixing-pot.description = Mediante cobre y silicio crea la aleación de latón. Puede ser potenciado con nitrógeno.
block.aquarion-magma-diffuser.name = Difusor de Lava
block.aquarion-magma-diffuser.description = Separa los materiales que conforman la lava y los pone a disposición para su uso.
block.aquarion-biotite-leaching-vessel.name = Separador de Biotita
block.aquarion-biotite-leaching-vessel.description = Usa ácido muriático para diluir la biotita y separarla en componentes útiles.
block.aquarion-geothermal-evaporator.name = Evaporador geotermal
block.aquarion-geothermal-evaporator.description = Usa el calor geotermal para hervir los haluros en agua, obteniendo ácido muriático y sal.
block.aquarion-nuetralization-vessel.name = Neutralizador
block.aquarion-nuetralization-vessel.description = Usa la neutralización ácida con el hidróxido básico para producir agua y calor.
block.aquarion-bauxite-centrifuge.name = Centrifugadora de Bauxita
block.aquarion-bauxite-centrifuge.description = Separa elementos como el aluminio y materia férrea de la bauxita mediante el uso de la fuerza centrífuga.
block.aquarion-ferrosilicon-foundry.name = Horno de aleación de Ferrosilicio
block.aquarion-ferrosilicon-foundry.description = Crea una aleación entre la materia férrea y silicio. Requiere agua y electricidad para funcionar. Puede ser potenciado con calor.
block.aquarion-ferrosilicon-foundry.details = Es un proceso lento, por lo que serán necesarios múltiples hornos para mantener un suministro estable.
block.aquarion-slag-refinement-array.name = Plataforma de refinamiento de magma
block.aquarion-slag-refinement-array.description = Refina el magma en diferentes sustancias. Requiere emisiones volcánicas
block.aquarion-azurite-kiln.name = Crisol de Azurita
block.aquarion-azurite-kiln.description = Derrite la azurita para obtener cobre e hidróxido.
block.aquarion-ammonia-compressor.name = Compresor de Amoníaco
block.aquarion-ammonia-compressor.description = Químicamente transforma el metano y el nitrógeno en amoníaco.
block.aquarion-cryogen-conditioner.name = Acondicionador de Sustancia Criogénica
block.aquarion-cryogen-conditioner.description = Mediante un ciclo de enfriamiento, usa amoníaco para enfriar aire hasta transformarlo en sustancia criogénica líquida.
block.aquarion-halite-refinery.name = Caldero de Halita
block.aquarion-halite-refinery.description = Hierve la halita para producir sal y potacio. Requiere agua y electricidad para funcionar. Produce vapor como subproducto.
block.aquarion-towanite-reduction-vat.name = Reductor de Towanita
block.aquarion-towanite-reduction-vat.description = Reduce la towanita en sus componentes básicos. Requiere emisiones volcánicas para funcionar.
block.aquarion-fume-mixer.name = Mezclador de emisiones
block.aquarion-fume-mixer.description = Produce artificialmente un compuesto gaseoso similar a las emisiones volcánicas naturales.
block.aquarion-galena-crucible.name = Crisol de Galena
block.aquarion-galena-crucible.description = Deconstrulle la galena, transformándola en sus componentes básicos: cobre, plomo y azufre.
block.aquarion-metaglass-pulverizer.name = Pulverizador de Metacristal
block.aquarion-metaglass-pulverizer.description = Pulveriza el metacristal y lo separa en plomo y silicio. Produce oxígeno como subproducto.
block.aquarion-fume-separator.name = Separador de Emisiones
block.aquarion-fume-separator.description = Rompe la estructura de las emisiones volcánicas y las convierte en materiales usables.
block.aquarion-cooling-tower.name = Torre de refigeración
block.aquarion-cooling-tower.description = Condensa el vapor, transformándose en agua mediante el uso de electricidad. El calor es extraido y redirigido hacia uno de los lados.
block.aquarion-solar-boiler.name = Caldera solar
block.aquarion-solar-boiler.description = Usa la radiación solar para evaporar el agua.
block.aquarion-solid-boiler.name = Caldera de combustión
block.aquarion-solid-boiler.description = Usa materiales sólidos inflamables para evaporar el agua. Los líquidos entrantes y salientes se comparten entre todas las calderas.
block.aquarion-solid-boiler.details = ¿Esperabas algo diferente?
block.aquarion-scrap-centrifuge.name = Centrifugadora de chatarra
block.aquarion-scrap-centrifuge.description = Mediante el uso de fuerza centrífuga, separa los componentes útiles que conforman la chatarra.
block.aquarion-cupronickel-alloying-crucible.name = Crisol de aleación de Cuproníquel
block.aquarion-cupronickel-alloying-crucible.description = Crea la aleación cuproníquel mediante cobre y níquel. Requiere aire para funcionar. Puede ser potenciado con calor y/o nitrógeno.
block.aquarion-metaglass-annealing-furnace.name = Horno de recocido de Metacristal
block.aquarion-metaglass-annealing-furnace.description = Recoce plomo y arena para producir metacristal. Requiere aire para ser enfriado y puede ser potenciado con calor y/o minio.
block.aquarion-thermal-cracking-unit.name = Unidad de craqueo termal
block.aquarion-thermal-cracking-unit.description = Deconstrulle el petróleo crudo, transformándolo en componentes más simples para posterior procesamiento.
block.aquarion-polymer-press.name = Prensa de Polímeros
block.aquarion-polymer-press.description = Usa calor extremo y presión para polimerizar el petróleo refinado.
block.aquarion-silicon-oxidator.name = Oxidador de Silicio
block.aquarion-silicon-oxidator.description = Reacciona silicio con oxígeno, produciendo arena.
block.aquarion-arc-furnace.name = Horno de arco eléctrico
block.aquarion-arc-furnace.description = Usa voltaje extremo para calentar arena. Produce silicio y oxígeno.
block.aquarion-haze-cracking-unit.name = Unidad de craqueo mediante Vapor
block.aquarion-haze-cracking-unit.description = Usa vapor para transformar el petróleo refinado en polímero. Produce amoníaco como subproducto.
block.aquarion-desulferization-assembly.name = Estructura de desulfurización
block.aquarion-desulferization-assembly.description = Extrae azufre del petróleo refinado, produciendo metano como subproducto. Requiere calor para funcionar.
block.aquarion-coal-liquefactor.name = Liquifactor de Carbón
block.aquarion-coal-liquefactor.description = Crea petróleo sintético mediante carbón, oxígeno, y calor.
block.aquarion-vacuum-freezer.name = Congelador al vacío
block.aquarion-vacuum-freezer.description = Refrigera el agua impura hasta el punto de congelamiento y fuerza a las impuresas a separarse.
block.aquarion-acuminite-degredation-array.name = Degradador de Acuminita
block.aquarion-acuminite-degredation-array.description = Deconstrulle los cristales de acuminita en sus componentes básicos: stronio, aluminio, y fluorita.
block.aquarion-atmospheric-centrifuge.name = Centrifugadora atmosférica
block.aquarion-atmospheric-centrifuge.description = Separa los componentes del aire mediante fuerza centrífuga. Altamente ineficiente.
block.aquarion-blast-furnace.name = Alto horno
block.aquarion-blast-furnace.description = Produce acero mediante grandes cantidades de materia férrea, oxígeno y carbón. Puede ser potenciado con argón.
block.aquarion-brine-mixer.name = Mezclador de Salmuera
block.aquarion-brine-mixer.description = Produces salmuera al combinar grandes cantidades de agua con sal.
block.aquarion-electrolysis-vat.name = Electrolizador de agua
block.aquarion-electrolysis-vat.description = Usa la electrólisis para separar el agua en hidrógeno y oxígeno gaseosos. El agua se reparte entre todos los electrolizadores adyacentes*.
block.aquarion-electrolysis-vat.details = *El hidrógeno y el oxígeno solo saldrán por sus lados correspondientes.
block.aquarion-brine-electrolysis-manifold.name = Electrolizador de Salmuera
block.aquarion-brine-electrolysis-manifold.description = Electroliza la salmuera en sus componentes más básicos: cloro, hidrógeno e hidróxido. 
block.aquarion-spore-processor.name = Procesador de esporas
block.aquarion-spore-processor.description = Mezcla y bate los cúmulos de esporas y los transforma en pasta biológica.
block.aquarion-gasifier.name = Gasificador
block.aquarion-gasifier.description =  Calienta la pasta biológica para producir carbón, vapor y calor.
block.aquarion-ultramafic-refinery.name = Refinería de rocas ultramáficas
block.aquarion-ultramafic-refinery.description = Separa la serpentina en sus componentes básicos.
block.aquarion-convection-heater.name = Calentador de convección
block.aquarion-convection-heater.description = Usa la convección termal del agua para producir una pequeña cantidad de calor.
block.aquarion-solid-heater.name = Calentador a combustión de sólidos
block.aquarion-solid-heater.description = Quema sólidos inflamables con oxígeno para producir calor.
block.aquarion-combustion-heater.name = Calentador a combustión de líquidos
block.aquarion-combustion-heater.description = Quema líquidos inflamables con oxígeno para producir calor.
block.aquarion-heat-channel.name = Canal de calor
block.aquarion-heat-channel.description = Transfiere calor a la estructura al frente. [scarlet]¡Se degradará a temperaturas exponencialmente altas![].
block.aquarion-filter.name = Filtro
block.aquarion-filter.description = Purifica el agua. El resultado es una agua pura que funciona como un mejor refigerante para las torretas. Atrapa partículas sólidas, produciendo arena y polvo (cobre, plomo, silicio, níquel).
block.aquarion-rotary-kiln.name = Crisol rotatorio
block.aquarion-rotary-kiln.description = Mezcla arena, calcio y potasio con agua y aire para producir concreto.

