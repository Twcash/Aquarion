item.aquarion-azurite.name = Azurita
item.aquarion-azurite.description = Un compuesto cristalino que contiene una gran cantidad de cobre y pequeñas cantidades de hidróxido.
item.aquarion-azurite.details = Roca azul dulce.
item.aquarion-aluminum.name = Aluminio
item.aquarion-aluminum.description = Un metal duradero que se utiliza para aleaciones, municiones y estructuras.
item.aquarion-aluminum.details = No es aluu-mi-ne-o es aluumi-nio.
item.aquarion-magnesium-powder.name = Polvo de magnesio
item.aquarion-magnesium-powder.description = Magnesio en polvo altamente reactivo. Se utiliza en aleaciones.
item.aquarion-magnesium-powder.details = Quizás útil en las carcasas de los reactores...
item.aquarion-minium.name = Minio
item.aquarion-minium.description = Óxido de plomo (II), altamente tóxico para la mayoría de los formas orgánicos. Útil en algunas reacciones químicas menores.
item.aquarion-minium.details = Miniplomo, Monóxido de Plomo, Litargirio, Masicot, Óxido Plumboso.
item.aquarion-serpentine.name = Serpentina
item.aquarion-serpentine.description = Mineral ultramáfico inorgánico que contiene hierro, aluminio, silicio y magnesio.
item.aquarion-polymer.name = Polímero
item.aquarion-polymer.description = Conjunto de compuestos orgánicos monoméricos polimerizados que forman una estructura reticular maleable. Útil para la construcción no conductora.
item.aquarion-manganese.name = Manganeso
item.aquarion-manganese.description = Elemento susceptible utilizado en infraestructuras, municiones y aleaciones.
item.aquarion-galena.name = Galena
item.aquarion-galena.description = Un cristal que contiene cobre, \uf837 [#8c7fa9]lead[], y brimstone.
item.aquarion-sodium.name = Sodio
item.aquarion-sodium.description = Un elemento reactivo blando utilizado para el intercambio de calor y que puede emplearse para producir compuestos ácidos.
item.aquarion-salt.name = Sal
item.aquarion-salt.description = Puede degradarse para obtener más materiales.
item.aquarion-salt.details = Se forma cuando un ácido y un compuesto básico se neutralizan entre sí.
item.aquarion-halite.name = Halita
item.aquarion-halite.description = Sal mineral que contiene impurezas de potacio. Puede ser usado en munición.
item.aquarion-halite.details = Mondongo azul.
item.aquarion-potassium.name = Potasio
item.aquarion-potassium.description = Metal altamente reactivo. Manejese con cuidado, explota con facilidad.
item.aquarion-potassium.details = ¿Bueno para los huesos?, No, ese es el calcio.
item.aquarion-acuminite.name = Acuminita
item.aquarion-acuminite.description = Un cristal que contiene una variedad de materiales útiles diferentes, entre ellos aluminio, flúor y estroncio.
item.aquarion-strontium.name = Estroncio
item.aquarion-strontium.description = Elemento altamente reactivo y magnético utilizado en la fabricación de estructuras para municiones o con fines de aleación.
item.aquarion-cupronickel.name = Cuproníquel
item.aquarion-cupronickel.description = Metal dúctil con alta tolerancia al calor. Se utiliza para una amplia variedad de usos.
item.aquarion-uranium.name = Uranio
item.aquarion-uranium.description = Metal altamente fisible. Puede usarse en reactores nucleares para obtener torio mediante decaimiento radioactivo.
item.aquarion-radium.name = Radio
item.aquarion-radium.description = *inserte descripción aquí*. Obtenido del decaimiento del torio.
item.aquarion-pitchblende.name = Pechblenda
item.aquarion-pitchblende.description = Dióxido de uranio. Puede ser refinado para obtener uranio fisible y oxígeno.
item.aquarion-cuprite.name = Cuprita
item.aquarion-cuprite.description = Óxido de cobre (I), un cristal rojo brillante que también se conoce como "Cobre Rubí".
item.aquarion-thorium.name = Torio
item.aquarion-thorium.description = Normalmente es lo que se denomina materia "fertil", pero por cuestiones de lore del mod, se considerará materia fisible. Puede ser usado en reactores nucleares para que decaiga en radio.
item.aquarion-spore-pod.name = Saco de Esporas
item.aquarion-spore-pod.description = Esporas altamente inflamables. Puede ser usado como combustible o procesado para producir pasta biológica.
item.aquarion-pentlandite.name = Pentlandita
item.aquarion-pentlandite.description = Un mineral de sulfuro que puede refinarse en hierro, níquel, y sulfuro.
item.aquarion-hexogen.name = Hexógeno
item.aquarion-hexogen.description = Un compuesto altamente explosivo capaz de destruir grandes porciones de terreno.
