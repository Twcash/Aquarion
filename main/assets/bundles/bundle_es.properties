##PLAYER POWER

block.aquarion-solar-generator.name = Generador solar
block.aquarion-solar-generator.description = Produce electricidad gracias a la radiación solar. Se necesitarán batería para contrarrestar el ciclo nocturno planetario.\n [scarlet]Moderadamente explosivo, colóquese con cuidado.[]
block.aquarion-advanced-solar-generator.name = Generador solar avanzado
block.aquarion-advanced-solar-generator.description = Produce electricidad gracias a la radiación solar y a los vientos de las tormentas. Resistente a los ambientes adversos, pero es [scarlet]Altamente explosivo.[]
block.aquarion-lead-burner.name = Quemador de plomo
block.aquarion-lead-burner.description = Usa la reacción oxidativa exotérmica entre el \uf837 [#8c7fa9]plomo[] y el \ue955 [#c1c1c1]aire[] para generar electricidad.
block.aquarion-hydroxide-reactor.name = Reactor de hidróxido
block.aquarion-hydroxide-reactor.description = Produce electricidad mediante la reacción entre el [violet]Hidróxido[] y el [blue]Agua[], produciendo calor e hidrógeno. \n El resto de productos obtenidos de esta reacción no son necesarios para el desarrollo de nuestra industria, por lo que serán desechados.
block.aquarion-minium-reactor.name = Reactor de minio
block.aquarion-minium-reactor.description = Usa el calor del vapor para degradar el \ue982 [#e4543c]minio[] permitiendo la mezcla del oxígeno con el sulfuro y el agua, produciendo \uf837 [#8c7fa9]plomo[] y vitriolo en el proceso.
block.aquarion-turbine-dynamo.name = Turbina industrial
block.aquarion-turbine-dynamo.description = Mediante el uso del [white]Vapor[] en altas presiones, se imprime movimiento en la turbina para generar electricidad. La cantidad generada depende de la cantidad de vapor suministrado.
block.aquarion-petroleum-engine.name = Generador a combustión de petróleo refinado
block.aquarion-petroleum-engine.description = Consume una gran cantidad de petróleo y oxígeno gaseoso para convertir la fuerza generada por la combustión química en electricidad.
block.aquarion-fume-engine.name = Turbina de emisiones
block.aquarion-fume-engine.description = Produce una cantidad moderada de electricidad mediante la combustión de las [tan]Emisiones volcánicas[]. [scarlet] Altamente explosivo.[]
block.aquarion-pylon.name = Poste
block.aquarion-pylon.description = Permite el transporte de electicidad hacia las estructuras que la requieran. No se puede conectar directamente a nada que consuma electricidad.
block.aquarion-pylon.details = Solo se conecta directamente a las baterías.
block.aquarion-outlet.name = Conector de entrada eléctrica
block.aquarion-outlet.description = Transfiere electricidad a la estructura que se encuentra delante. Solo puede suministrar una cantidad limitada, por lo que para muchas estructuras se necesitarán varios. Puede ser encendido o apagado con un click.
block.aquarion-energy-bank.name = Banco de energía
block.aquarion-energy-bank.description = Almacena una pequeña cantidad de energía. No se conecta a otras estructuras por proximidad.
block.aquarion-capacitor-bank.name = Banco capacitor
block.aquarion-capacitor-bank.description = Almacena una cantidad moderada de energía. No se conecta a otras estructuras por proximidad.
block.aquarion-ion-battery.name = Batería de iones
block.aquarion-ion-battery.description = Almacena grandes cantidades de energía. No se conecta a otras estructuras por proximidad.
block.aquarion-heat-engine.name = Generador térmico
block.aquarion-heat-engine.description = Utiliza el calor geotermal para producir electricidad. Produce magma como subproducto.
block.aquarion-basic-heat-exchanger.name = Intercambiador de calor básico
block.aquarion-basic-heat-exchanger.description = Evapora el agua mediante una fuente de calor externo y produce un poco de energía residual. Puede explotar si el vapor alcanza niveles críticos o si no se le suministra suficiente agua.
block.aquarion-singularity-reactor.name = Reactor de singularidad
block.aquarion-singularity-reactor.description = Aniquila la materia para producir electricidad. La electricidad generada es directamente proporcional a la cantidad de objetos entrantes.

