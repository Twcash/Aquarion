block.aquarion-siphon-sorter.name = Clasificador de sifón
block.aquarion-siphon-sorter.description = Al seleccionar un fluido, solo este podrá avanzar, el resto será redirigido hacia los lados.
block.aquarion-siphon.name = Sifón
block.aquarion-siphon.description = Mueve fluidos hacia delante. [#c61e1e]SE DERRETIRÁ A ALTAS TEMPERATURAS.
block.aquarion-pulse-siphon.name = Sifón de pulso
block.aquarion-pulse-siphon.description = Mueve fluidos hacia delante.
block.aquarion-siphon-router.name = Enrutador de sifón
