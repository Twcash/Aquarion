item.aquarion-biotite.details = Su composición parece ser principalmente de annita, un mineral filosilicato con un grupo hidroxilo que puede ser reutilizado para formar hidróxido.
item.aquarion-bauxite.name = Bauxita
item.aquarion-bauxite.description = Un aluminosilicato férrico. Se utiliza para el proxenetismo de aluminio.
item.aquarion-bauxite.details = Un material de aluminio sobrevalorado. La verdad es que la Criolita es mejor en todos los sentidos.
item.aquarion-ceramic.name = Cerámica
item.aquarion-ceramic.description = Material quebradizo, similar al vidrio, con alta capacidad calorífica. Se utiliza como material de construcción básico y como munición para armas de metralla.
item.aquarion-nickel.name = Níquel
item.aquarion-nickel.description = Material ferromagnético y maleable utilizado en la construcciones básica y en la fabricación de municiones. También se emplea en diversos procesos de refinación.
