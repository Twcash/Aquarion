block.aquarion-siphon-junction.name = Cruze de sifón
block.aquarion-siphon-junction.description = Permite que dos silitubos se cruzen sin intercambiar fluidos. Funciona también como un cruze entre un silitubo y una cinta trasportadora. [#c61e1e]SE DERRETIRÁ A ALTAS TEMPERATURAS.
block.aquarion-siphon-junction.details = Un mal necesario
block.aquarion-siphon-tank.name = Tanque de sifón
block.aquarion-siphon-tank.description = Almacena grandes cantidades de fluidos. [#c61e1e]SE DERRETIRÁ A ALTAS TEMPERATURAS.
block.aquarion-siphon-vessel.name = Recipiente de sifón
block.aquarion-siphon-vessel.description = Almacena cantidades moderadas de fluido. [#c61e1e]SE DERRETIRÁ A ALTAS TEMPERATURAS.
block.aquarion-siphon-gulley.name = Tanque culón de sifón
block.aquarion-siphon-gulley.description = Almacena cantidades enormes de fluidos. [#c61e1e]SE DERRETIRÁ A ALTAS TEMPERATURAS.
block.aquarion-siphon-reservoir.name = Reservorio de sifón
block.aquarion-siphon-reservoir.description = Almacena cantidades masivas de fluidos. [#c61e1e]SE DERRETIRÁ A ALTAS TEMPERATURAS.
block.aquarion-pipe.name = Tubería
block.aquarion-pipe.description = Mueve fluidos a gran velocidad. Nunca tendrá salideros.
block.aquarion-pipe.details = ¡¡¡NO SE DERRITE!!!
block.aquarion-centrifugal-pump.name = Bomba centrífuga
block.aquarion-centrifugal-pump.description = Extrae líquidos superficiales.
block.aquarion-pump-assembly.name = Complejo de bombeo
block.aquarion-pump-assembly.description = Extrae grandes cantidades de líquidos superficiales.


